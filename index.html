<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jade's Game</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Patriots */
  --pats-navy: #002244;
  --pats-red: #C60C30;
  --pats-silver: #B0B7BC;
  /* Seahawks */
  --sea-navy: #002244;
  --sea-green: #69BE28;
  --sea-gray: #A5ACAF;
  /* ESPN */
  --espn-red: #CC0000;
  --espn-dark: #1a1a1a;
  /* Field */
  --field-green: #2E7D32;
  --field-light: #388E3C;
  --field-dark: #1B5E20;
  /* UI */
  --glass-bg: rgba(0,0,0,0.75);
  --glass-border: rgba(255,255,255,0.12);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.7);
  --gold: #FFD700;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  color: var(--text-primary);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

canvas#game {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}

/* ======= UI OVERLAY ======= */
#ui-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#ui-overlay > * { pointer-events: auto; }

/* ======= COMMENTARY BAR ======= */
#commentary-bar {
  position: absolute;
  top: env(safe-area-inset-top, 0px);
  left: 0; right: 0;
  padding: 8px 16px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 80%, transparent 100%);
  opacity: 0;
  transform: translateY(-20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  pointer-events: none;
}
#commentary-bar.visible {
  opacity: 1;
  transform: translateY(0);
}
#commentary-bar .play-by-play {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.3;
}
#commentary-bar .color-commentary {
  font-size: 12px;
  font-weight: 400;
  color: var(--gold);
  line-height: 1.3;
  font-style: italic;
}
#commentary-bar .espn-tag {
  display: inline-block;
  background: var(--espn-red);
  color: white;
  font-size: 9px;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 2px;
  margin-right: 6px;
  letter-spacing: 0.5px;
  vertical-align: middle;
}

/* ======= SCOREBOARD ======= */
#scoreboard {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 12px calc(env(safe-area-inset-bottom, 8px) + 8px) 12px;
  background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
#scoreboard.visible {
  opacity: 1;
  transform: translateY(0);
}

.score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
}
.team-score {
  display: flex;
  align-items: center;
  gap: 8px;
}
.team-logo {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900;
  font-size: 10px;
  letter-spacing: -0.5px;
}
.team-logo.pats { background: var(--pats-navy); border: 2px solid var(--pats-red); }
.team-logo.sea { background: var(--sea-green); border: 2px solid var(--sea-navy); }
.team-name {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.team-pts {
  font-size: 28px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}
.possession-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  margin-left: 6px;
  opacity: 0;
  transition: opacity 0.3s;
}
.possession-dot.active { opacity: 1; }

.game-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 4px;
  border-top: 1px solid var(--glass-border);
  margin-top: 4px;
}
.down-distance {
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
}
.quarter-time {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.game-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  text-align: center;
  padding-bottom: 4px;
}

/* ======= PLAY CARDS ======= */
#play-cards {
  position: absolute;
  bottom: 180px;
  left: 12px; right: 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}
#play-cards.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.play-card {
  flex: 1;
  max-width: 120px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.play-card:active {
  transform: scale(0.95);
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.3);
}
.play-card .card-icon {
  font-size: 28px;
  margin-bottom: 6px;
  display: block;
}
.play-card .card-name {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
}
.play-card .card-desc {
  font-size: 10px;
  color: var(--text-secondary);
  line-height: 1.3;
}

/* ======= MOMENT CARD (teaching popup) ======= */
#moment-card {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: calc(100% - 48px);
  max-width: 340px;
  background: rgba(20,20,20,0.95);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 24px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.4s ease;
  z-index: 20;
}
#moment-card.visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: auto;
}
#moment-card .moment-emoji {
  font-size: 48px;
  margin-bottom: 12px;
  display: block;
}
#moment-card .moment-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
#moment-card .moment-body {
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
#moment-card .moment-body strong {
  color: var(--gold);
  font-weight: 700;
}
#moment-card .moment-tap {
  font-size: 12px;
  color: var(--text-secondary);
  opacity: 0.6;
}

/* ======= TITLE SCREEN ======= */
#title-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  background: #000;
}
#title-screen .title-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 30%, rgba(204,0,0,0.15) 0%, transparent 60%),
              radial-gradient(ellipse at 50% 70%, rgba(0,34,68,0.3) 0%, transparent 50%);
}
#title-screen .title-content {
  position: relative;
  z-index: 1;
  text-align: center;
}
#title-screen h1 {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  background: linear-gradient(180deg, #fff 0%, #B0B7BC 50%, #6a6a6a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  text-shadow: none;
}
#title-screen .subtitle {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--pats-red);
  margin-bottom: 40px;
}
#title-screen .matchup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 50px;
}
#title-screen .matchup-team {
  text-align: center;
}
#title-screen .matchup-team .helmet {
  width: 60px; height: 60px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 8px;
  border: 3px solid rgba(255,255,255,0.2);
}
#title-screen .matchup-team .helmet.pats { background: var(--pats-navy); border-color: var(--pats-red); }
#title-screen .matchup-team .helmet.sea { background: var(--sea-navy); border-color: var(--sea-green); }
#title-screen .matchup-team .tname {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#title-screen .vs-text {
  font-size: 24px;
  font-weight: 900;
  color: var(--text-secondary);
}
#title-screen .tap-start {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-primary);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.stadium-lights {
  position: absolute;
  top: -20%; left: 50%;
  transform: translateX(-50%);
  width: 200%;
  height: 50%;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, transparent 70%);
  animation: lightSweep 4s ease-in-out infinite alternate;
}
@keyframes lightSweep {
  0% { transform: translateX(-60%); }
  100% { transform: translateX(-40%); }
}

/* ======= TUNNEL OVERLAY ======= */
#tunnel-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 90;
  background: #000;
  display: none;
  overflow: hidden;
}
#tunnel-overlay canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
#tunnel-overlay .tunnel-text {
  position: absolute;
  bottom: 15%;
  left: 0; right: 0;
  text-align: center;
  padding: 0 24px;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.6;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#tunnel-overlay .tunnel-text.visible { opacity: 1; }
#tunnel-overlay .tunnel-skip {
  position: absolute;
  top: calc(env(safe-area-inset-top, 12px) + 12px);
  right: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  opacity: 0.5;
  padding: 8px;
}

/* ======= GAME OVER SCREEN ======= */
#game-over {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 80;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  text-align: center;
  padding: 24px;
}
#game-over .result-emoji { font-size: 64px; margin-bottom: 16px; }
#game-over .result-title {
  font-size: 32px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
#game-over .result-score {
  font-size: 48px;
  font-weight: 900;
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
#game-over .result-msg {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 32px;
  max-width: 280px;
}
#game-over .btn {
  padding: 14px 32px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: none;
  cursor: pointer;
  margin: 6px 0;
  width: 220px;
  -webkit-tap-highlight-color: transparent;
}
#game-over .btn-primary {
  background: var(--pats-red);
  color: white;
}
#game-over .btn-secondary {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid var(--glass-border);
}

/* ======= SNAP PROMPT ======= */
#snap-prompt {
  position: absolute;
  bottom: 260px;
  left: 0; right: 0;
  text-align: center;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
#snap-prompt.visible { opacity: 1; pointer-events: auto; }
#snap-prompt .snap-text {
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  animation: pulse 1.5s ease-in-out infinite;
}

/* ======= RECEIVER MARKERS ======= */
.receiver-marker {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  background: rgba(255,215,0,0.15);
  transform: translate(-50%, -50%);
  animation: receiverPulse 1s ease-in-out infinite;
  cursor: pointer;
  z-index: 15;
}
@keyframes receiverPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); }
  50% { box-shadow: 0 0 0 12px rgba(255,215,0,0); }
}

/* ======= SCREEN FLASH ======= */
.screen-flash {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: white;
  z-index: 200;
  pointer-events: none;
  animation: flash 0.6s ease-out forwards;
}
@keyframes flash {
  0% { opacity: 0.8; }
  100% { opacity: 0; }
}

/* ======= DARK OVERLAY FOR DIMMING ======= */
#dim-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#dim-overlay.visible { opacity: 1; }

/* ======= INTRO MATCHUP CARD ======= */
#matchup-card {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 85;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.85);
  text-align: center;
}
#matchup-card .mc-espn {
  background: var(--espn-red);
  color: white;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 3px;
  letter-spacing: 2px;
  margin-bottom: 24px;
}
#matchup-card .mc-teams {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 24px;
}
#matchup-card .mc-team {
  text-align: center;
}
#matchup-card .mc-helmet {
  width: 72px; height: 72px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin: 0 auto 10px;
  border: 3px solid rgba(255,255,255,0.2);
}
#matchup-card .mc-helmet.pats { background: var(--pats-navy); border-color: var(--pats-red); }
#matchup-card .mc-helmet.sea { background: var(--sea-navy); border-color: var(--sea-green); }
#matchup-card .mc-tname {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#matchup-card .mc-record {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
}
#matchup-card .mc-vs {
  font-size: 28px;
  font-weight: 900;
  color: var(--text-secondary);
}
#matchup-card .mc-game-label {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 40px;
}
#matchup-card .mc-tap {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: pulse 2s ease-in-out infinite;
}
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <div class="stadium-lights"></div>
  <div class="title-bg"></div>
  <div class="title-content">
    <h1>Jade's Game</h1>
    <div class="subtitle">Learn Football</div>
    <div class="matchup">
      <div class="matchup-team">
        <div class="helmet pats">🏈</div>
        <div class="tname">Patriots</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="matchup-team">
        <div class="helmet sea">🦅</div>
        <div class="tname">Seahawks</div>
      </div>
    </div>
    <div class="tap-start">Tap to Start</div>
  </div>
</div>

<!-- TUNNEL SEQUENCE -->
<div id="tunnel-overlay">
  <canvas id="tunnel-canvas"></canvas>
  <div class="tunnel-text" id="tunnel-text"></div>
  <div class="tunnel-skip">TAP TO SKIP</div>
</div>

<!-- MATCHUP CARD -->
<div id="matchup-card">
  <div class="mc-espn">ESPN</div>
  <div class="mc-game-label" id="mc-game-label">Game 1 of 5</div>
  <div class="mc-teams">
    <div class="mc-team">
      <div class="mc-helmet pats">🏈</div>
      <div class="mc-tname">Patriots</div>
      <div class="mc-record">You</div>
    </div>
    <div class="mc-vs">VS</div>
    <div class="mc-team">
      <div class="mc-helmet sea">🦅</div>
      <div class="mc-tname">Seahawks</div>
      <div class="mc-record">CPU</div>
    </div>
  </div>
  <div class="mc-tap">Tap to Play</div>
</div>

<!-- GAME CANVAS -->
<canvas id="game"></canvas>

<!-- UI OVERLAY -->
<div id="ui-overlay">
  <!-- Commentary Bar -->
  <div id="commentary-bar">
    <div class="play-by-play" id="pbp-text"></div>
    <div class="color-commentary" id="color-text"></div>
  </div>

  <!-- Snap Prompt -->
  <div id="snap-prompt">
    <div class="snap-text">TAP TO SNAP</div>
  </div>

  <!-- Play Cards -->
  <div id="play-cards"></div>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <div class="game-label" id="game-label">Game 1 — The Basics</div>
    <div class="score-row">
      <div class="team-score">
        <div class="team-logo pats">NE</div>
        <div class="team-name">Patriots</div>
        <div class="possession-dot" id="pats-possession"></div>
      </div>
      <div class="team-pts" id="pats-score">0</div>
    </div>
    <div class="score-row">
      <div class="team-score">
        <div class="team-logo sea">SEA</div>
        <div class="team-name">Seahawks</div>
        <div class="possession-dot" id="sea-possession"></div>
      </div>
      <div class="team-pts" id="sea-score">0</div>
    </div>
    <div class="game-info">
      <div class="down-distance" id="down-distance">1ST & 10</div>
      <div class="quarter-time" id="quarter-time">Q1 15:00</div>
    </div>
  </div>
</div>

<!-- Dim overlay for moment cards -->
<div id="dim-overlay"></div>

<!-- Moment Card (teaching) -->
<div id="moment-card">
  <div class="moment-emoji" id="moment-emoji"></div>
  <div class="moment-title" id="moment-title"></div>
  <div class="moment-body" id="moment-body"></div>
  <div class="moment-tap">Tap to continue</div>
</div>

<!-- Game Over -->
<div id="game-over">
  <div class="result-emoji" id="result-emoji"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-msg" id="result-msg"></div>
  <button class="btn btn-primary" id="btn-next">Next Game</button>
  <button class="btn btn-secondary" id="btn-replay">Replay</button>
</div>

<script>
// ============================================================
// JADE'S GAME — Full Implementation
// ============================================================

(function() {
'use strict';

// ---- CONSTANTS ----
const PI = Math.PI, TAU = PI * 2;
const FIELD_YARDS = 100;
const YARD_PX = 12; // pixels per yard in world space
const ENDZONE_YARDS = 10;

// Team colors
const PATS = { primary: '#002244', secondary: '#C60C30', accent: '#B0B7BC', name: 'Patriots' };
const SEA = { primary: '#002244', secondary: '#69BE28', accent: '#A5ACAF', name: 'Seahawks' };

// ---- DOM REFS ----
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');
const tunnelCanvas = $('tunnel-canvas');
const tunnelCtx = tunnelCanvas.getContext('2d');

// UI elements
const titleScreen = $('title-screen');
const tunnelOverlay = $('tunnel-overlay');
const matchupCard = $('matchup-card');

// ---- COMMENTARY LINES ----
function getPlayCommentary(play, result, yards) {
  const lines = [];
  if (play.type === 'run') {
    if (yards > 15) {
      lines.push({ pbp: `Handoff — and he BREAKS FREE! ${yards} yard gain!`, color: "What a run! The offensive line created a massive hole and the running back hit it perfectly." });
    } else if (yards > 5) {
      lines.push({ pbp: `Good run up the middle for ${yards} yards.`, color: "Solid play. The running back found a gap and picked up good yardage." });
    } else if (yards > 0) {
      lines.push({ pbp: `Run play, stuffed after ${yards} yards.`, color: "The defense read that one well. Sometimes you just take what you can get." });
    } else {
      lines.push({ pbp: "Tackled behind the line of scrimmage!", color: "That's a loss! The defense broke through and stopped it cold." });
    }
  } else if (play.type === 'pass') {
    if (result === 'complete') {
      if (yards > 25) {
        lines.push({ pbp: `WHAT A THROW! Complete for ${yards} yards!`, color: "A BOMB! The quarterback put it right on the money and the receiver hauled it in!" });
      } else if (yards > 10) {
        lines.push({ pbp: `Pass complete for ${yards} yards!`, color: "Nice connection! That's what the passing game is all about." });
      } else {
        lines.push({ pbp: `Short pass, ${yards} yards gained.`, color: "A safe, smart throw. Sometimes the short game is all you need." });
      }
    } else if (result === 'incomplete') {
      lines.push({ pbp: "Pass falls incomplete.", color: "Nobody came down with it. The clock stops on an incomplete pass — remember that!" });
    } else if (result === 'interception') {
      lines.push({ pbp: "INTERCEPTED! The defense picks it off!", color: "Oh no! The defender read the quarterback's eyes and jumped the route." });
    }
  }
  if (result === 'touchdown') {
    lines.push({ pbp: "TOUCHDOWN PATRIOTS!! 🎉", color: "Six points! Now we kick the extra point to make it seven!" });
  }
  return lines;
}

function getDownCommentary(d, ytg, yard) {
  const ordinals = ['', '1st', '2nd', '3rd', '4th'];
  if (d <= 4) {
    if (d === 3 && ytg > 7) {
      return { pbp: `${ordinals[d]} and ${ytg}. This is a big play.`, color: "3rd and long — the defense knows a pass is coming. Pick your moment." };
    }
    if (d === 4) {
      if (yard >= 60) {
        return { pbp: `4th down. Field goal range!`, color: "You can try for a field goal here — 3 points. Or go for it if you're feeling bold!" };
      }
      return { pbp: `4th down — decision time.`, color: "You can go for it (risky!) or punt the ball away. Let's see what you choose." };
    }
  }
  return null;
}

// ---- AUDIO ENGINE ----
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioUnlocked = true;
}

function playSound(type) {
  if (!audioCtx || !audioUnlocked) return;
  try {
    const now = audioCtx.currentTime;
    if (type === 'whistle') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(3200, now);
      osc.frequency.linearRampToValueAtTime(2800, now + 0.3);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if (type === 'hit') {
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 200;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      source.connect(filter).connect(gain).connect(audioCtx.destination);
      source.start(now);
    } else if (type === 'touchdown') {
      [220, 277, 330, 440].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, now + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i * 0.12);
        osc.stop(now + i * 0.12 + 0.5);
      });
    } else if (type === 'crowd_roar') {
      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 800;
      filter.Q.value = 0.5;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.2);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.8);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
      source.connect(filter).connect(gain).connect(audioCtx.destination);
      source.start(now);
    } else if (type === 'bloop') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'crowd_ambient') {
      // Continuous crowd noise — create and return node for control
      const bufferSize = audioCtx.sampleRate * 3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 600;
      filter.Q.value = 0.3;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.06;
      source.connect(filter).connect(gain).connect(audioCtx.destination);
      source.start();
      return { source, gain };
    }
  } catch(e) { /* audio error, ignore */ }
}

let crowdAmbient = null;
function startCrowdAmbient() {
  if (!crowdAmbient && audioCtx) {
    crowdAmbient = playSound('crowd_ambient');
  }
}
function setCrowdVolume(v) {
  if (crowdAmbient && crowdAmbient.gain) {
    crowdAmbient.gain.gain.linearRampToValueAtTime(v * 0.12, audioCtx.currentTime + 0.3);
  }
}

// ---- PARTICLE SYSTEM ----
function spawnParticles(x, y, count, color, speed, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TAU;
    const spd = speed * (0.5 + Math.random() * 0.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - (speed * 0.5),
      life: life * (0.5 + Math.random() * 0.5),
      maxLife: life,
      color,
      size: 2 + Math.random() * 4,
      gravity: 0.15
    });
  }
}

function spawnConfetti(x, y) {
  const colors = ['#C60C30', '#002244', '#FFD700', '#FFFFFF', '#B0B7BC'];
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * TAU;
    const spd = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 4,
      life: 2 + Math.random() * 2,
      maxLife: 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 3 + Math.random() * 5,
      gravity: 0.08,
      rotation: Math.random() * TAU,
      rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.life -= dt;
    if (p.rotation !== undefined) p.rotation += p.rotSpeed;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    if (p.rotation !== undefined) {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---- CROWD PRE-GENERATION ----
let crowdDots = null;
function generateCrowd() {
  crowdDots = [];
  for (let row = 0; row < 8; row++) {
    const density = 40 + row * 5;
    for (let i = 0; i < density; i++) {
      const xPct = i / density;
      const xJitter = (Math.random() - 0.5) * 4;
      const yJitter = (Math.random() - 0.5) * 2;
      const brightness = 0.15 + Math.random() * 0.15;
      const isPatsFan = Math.random() > 0.5;
      const dotSize = 1.5 + row * 0.3;
      crowdDots.push({ row, xPct, xJitter, yJitter, brightness, isPatsFan, dotSize });
    }
  }
}
generateCrowd();

// ---- FIELD RENDERER (Pseudo-3D) ----
// The field is rendered in perspective from behind the QB
// Y coordinates: 0 = horizon (top), H = bottom of screen (near camera)

function worldToScreen(wx, wy) {
  // wx: -1 to 1 (left to right across field)
  // wy: 0 to 1 (near to far, 0=camera, 1=far end zone)
  const horizon = H * 0.28;
  const fov = 1.2;
  const d = 0.1 + wy * fov;
  const sy = horizon + (H - horizon) * (0.1 / d);
  const scale = (H - sy) / (H - horizon);
  const sx = W / 2 + wx * W * 0.6 * (1 - wy * 0.7);
  return { x: sx, y: sy, scale: Math.max(0.1, scale) };
}

function drawField() {
  // Sky / stadium
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.35);
  skyGrad.addColorStop(0, '#0a0a15');
  skyGrad.addColorStop(0.5, '#111128');
  skyGrad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.35);

  // Stadium lights (top)
  for (let i = 0; i < 5; i++) {
    const lx = W * (0.1 + i * 0.2);
    const ly = H * 0.02;
    const grad = ctx.createRadialGradient(lx, ly, 0, lx, ly, H * 0.25);
    grad.addColorStop(0, 'rgba(255,255,200,0.12)');
    grad.addColorStop(0.5, 'rgba(255,255,200,0.03)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(lx - H * 0.25, ly, H * 0.5, H * 0.3);
  }

  // Crowd (pre-generated dots for no flicker)
  const horizon = H * 0.28;
  const crowdTop = H * 0.05;
  ctx.save();
  if (crowdDots) {
    for (const dot of crowdDots) {
      const y = crowdTop + dot.row * (horizon - crowdTop) / 8;
      const x = dot.xPct * W;
      if (dot.isPatsFan) {
        ctx.fillStyle = `rgba(0, 34, 68, ${dot.brightness})`;
      } else {
        ctx.fillStyle = `rgba(105, 190, 40, ${dot.brightness * 0.8})`;
      }
      ctx.fillRect(x + dot.xJitter, y + dot.yJitter, dot.dotSize, dot.dotSize * 1.5);
    }
  }
  ctx.restore();

  // Field surface
  const fieldTop = horizon;
  const fieldGrad = ctx.createLinearGradient(0, fieldTop, 0, H);
  fieldGrad.addColorStop(0, '#1B5E20');
  fieldGrad.addColorStop(0.3, '#2E7D32');
  fieldGrad.addColorStop(1, '#388E3C');
  ctx.fillStyle = fieldGrad;
  ctx.fillRect(0, fieldTop, W, H - fieldTop);

  // Yard lines (perspective)
  // Show lines relative to ball position
  const baseYard = Math.floor(ballYard / 5) * 5;
  for (let yd = -20; yd <= 60; yd += 5) {
    const worldY = (yd + 20) / 80; // normalized 0-1 for rendering depth
    const sp = worldToScreen(0, worldY);

    if (sp.y < fieldTop || sp.y > H) continue;

    // Line width thins with distance
    const lineAlpha = Math.max(0.1, 1 - worldY * 0.9);
    ctx.strokeStyle = `rgba(255,255,255,${lineAlpha * 0.6})`;
    ctx.lineWidth = Math.max(0.5, (1 - worldY) * 2);
    ctx.beginPath();
    const left = worldToScreen(-1, worldY);
    const right = worldToScreen(1, worldY);
    ctx.moveTo(left.x, sp.y);
    ctx.lineTo(right.x, sp.y);
    ctx.stroke();

    // Yard numbers
    const actualYard = baseYard + yd;
    if (actualYard % 10 === 0 && actualYard >= 0 && actualYard <= 100) {
      const displayNum = actualYard <= 50 ? actualYard : 100 - actualYard;
      if (displayNum > 0 && lineAlpha > 0.3) {
        ctx.fillStyle = `rgba(255,255,255,${lineAlpha * 0.4})`;
        ctx.font = `${Math.max(8, 14 * (1 - worldY))}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        const numLeft = worldToScreen(-0.85, worldY);
        const numRight = worldToScreen(0.85, worldY);
        ctx.fillText(displayNum, numLeft.x, sp.y - 2);
        ctx.fillText(displayNum, numRight.x, sp.y - 2);
      }
    }
  }

  // Grass stripes (alternating shade)
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  for (let yd = -20; yd <= 60; yd += 5) {
    if (yd % 10 !== 0) continue;
    const y1 = worldToScreen(0, (yd + 20) / 80).y;
    const y2 = worldToScreen(0, (yd + 25) / 80).y;
    if (y1 > H || y2 < fieldTop) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, Math.min(y1, y2), W, Math.abs(y2 - y1));
  }
  ctx.restore();

  // End zone coloring
  // Opponent end zone (far)
  const ezFarTop = worldToScreen(0, 0.9).y;
  if (ezFarTop < H) {
    ctx.fillStyle = 'rgba(105, 190, 40, 0.15)';
    ctx.fillRect(0, Math.max(fieldTop, ezFarTop), W, H * 0.05);
    // "SEAHAWKS" text
    const sp = worldToScreen(0, 0.92);
    if (sp.y > fieldTop) {
      ctx.fillStyle = 'rgba(105, 190, 40, 0.2)';
      ctx.font = `bold ${Math.max(6, 12)}px -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('SEAHAWKS', sp.x, sp.y);
    }
  }

  // Line of scrimmage (bright line)
  const losWorld = 0.25; // line of scrimmage fixed at camera-relative position
  const losScreen = worldToScreen(0, losWorld);
  const losLeft = worldToScreen(-1, losWorld);
  const losRight = worldToScreen(1, losWorld);
  ctx.strokeStyle = 'rgba(0, 136, 255, 0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(losLeft.x, losScreen.y);
  ctx.lineTo(losRight.x, losScreen.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // First down line (yellow)
  if (yardsToGo > 0 && down <= 4) {
    const fdWorld = losWorld + (yardsToGo / 80) * 1;
    if (fdWorld < 1) {
      const fdScreen = worldToScreen(0, fdWorld);
      const fdLeft = worldToScreen(-1, fdWorld);
      const fdRight = worldToScreen(1, fdWorld);
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(fdLeft.x, fdScreen.y);
      ctx.lineTo(fdRight.x, fdScreen.y);
      ctx.stroke();
    }
  }

  // Sideline markings
  const sideL = worldToScreen(-0.95, 0);
  const sideR = worldToScreen(0.95, 0);
  const sideTopL = worldToScreen(-0.95, 1);
  const sideTopR = worldToScreen(0.95, 1);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sideL.x, sideL.y);
  ctx.lineTo(sideTopL.x, sideTopL.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sideR.x, sideR.y);
  ctx.lineTo(sideTopR.x, sideTopR.y);
  ctx.stroke();
}

// ---- PLAYER RENDERER ----
function drawPlayer(wx, wy, teamColor, accentColor, isHighlighted, label) {
  const sp = worldToScreen(wx, wy);
  const s = sp.scale * 1.2;
  const px = sp.x, py = sp.y;

  if (py < H * 0.2 || py > H + 20) return; // off screen

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py + 2 * s, 8 * s, 3 * s, 0, 0, TAU);
  ctx.fill();

  // Body
  ctx.fillStyle = teamColor;
  ctx.beginPath();
  ctx.ellipse(px, py - 10 * s, 7 * s, 12 * s, 0, 0, TAU);
  ctx.fill();

  // Jersey stripe
  ctx.fillStyle = accentColor;
  ctx.fillRect(px - 5 * s, py - 14 * s, 10 * s, 3 * s);

  // Helmet
  ctx.fillStyle = teamColor;
  ctx.beginPath();
  ctx.arc(px, py - 22 * s, 6 * s, 0, TAU);
  ctx.fill();

  // Facemask
  ctx.fillStyle = 'rgba(180,180,180,0.6)';
  ctx.fillRect(px - 3 * s, py - 20 * s, 6 * s, 2 * s);

  // Highlight ring
  if (isHighlighted) {
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(px, py, 12 * s, 5 * s, 0, 0, TAU);
    ctx.stroke();
    // Pulse ring
    const pulseSize = 14 + Math.sin(Date.now() / 200) * 4;
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(px, py, pulseSize * s, (pulseSize * 0.4) * s, 0, 0, TAU);
    ctx.stroke();
  }

  // Label (number or position)
  if (label && s > 0.3) {
    ctx.fillStyle = 'white';
    ctx.font = `bold ${Math.max(7, 10 * s)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(label, px, py - 6 * s);
  }

  return { x: px, y: py, scale: s };
}

function drawBall(wx, wy, airborne) {
  const sp = worldToScreen(wx, wy);
  const s = sp.scale;
  ctx.save();
  if (airborne) {
    // Ball in air — draw with trail
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y - 30 * s, 5 * s, 3 * s, -0.3, 0, TAU);
    ctx.fill();
    // Laces
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sp.x - 2 * s, sp.y - 31 * s);
    ctx.lineTo(sp.x + 2 * s, sp.y - 31 * s);
    ctx.stroke();
    // Trail
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2 * s;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y - 30 * s);
    ctx.lineTo(sp.x - 15 * s, sp.y - 20 * s);
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    // Ball on ground or carried
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y - 14 * s, 4 * s, 2.5 * s, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

// ---- FORMATION SETUP ----
function setupFormation(playType) {
  offensePlayers = [];
  defensePlayers = [];

  // Offensive line (5 players at line of scrimmage)
  for (let i = -2; i <= 2; i++) {
    offensePlayers.push({ wx: i * 0.08, wy: 0.25, role: 'OL', label: '' });
  }

  // QB (behind center)
  offensePlayers.push({ wx: 0, wy: 0.2, role: 'QB', label: 'QB' });

  // RB (behind QB)
  offensePlayers.push({ wx: 0.05, wy: 0.15, role: 'RB', label: 'RB' });

  // Wide receivers
  offensePlayers.push({ wx: -0.45, wy: 0.26, role: 'WR', label: 'WR' });
  offensePlayers.push({ wx: 0.45, wy: 0.26, role: 'WR', label: 'WR' });
  offensePlayers.push({ wx: -0.3, wy: 0.24, role: 'WR', label: 'WR' });

  // Defense
  // DL (4 defensive linemen)
  for (let i = -1.5; i <= 1.5; i++) {
    defensePlayers.push({ wx: i * 0.07, wy: 0.29, role: 'DL', label: '' });
  }

  // Linebackers
  defensePlayers.push({ wx: -0.15, wy: 0.35, role: 'LB', label: 'LB' });
  defensePlayers.push({ wx: 0, wy: 0.37, role: 'LB', label: 'LB' });
  defensePlayers.push({ wx: 0.15, wy: 0.35, role: 'LB', label: 'LB' });

  // Defensive backs
  defensePlayers.push({ wx: -0.4, wy: 0.42, role: 'CB', label: 'CB' });
  defensePlayers.push({ wx: 0.4, wy: 0.42, role: 'CB', label: 'CB' });
  defensePlayers.push({ wx: -0.1, wy: 0.5, role: 'S', label: 'S' });
  defensePlayers.push({ wx: 0.1, wy: 0.5, role: 'S', label: 'S' });
}

function drawFormation(highlightReceivers) {
  // Draw defense first (further away)
  for (const p of defensePlayers) {
    drawPlayer(p.wx, p.wy, SEA.primary, SEA.secondary, false, p.label);
  }

  // Draw offense
  receiverTargets = [];
  for (const p of offensePlayers) {
    const isWR = p.role === 'WR';
    const highlight = highlightReceivers && isWR;
    const screenPos = drawPlayer(p.wx, p.wy, PATS.primary, PATS.secondary, highlight, p.label);
    if (isWR && highlightReceivers && screenPos) {
      receiverTargets.push({ ...p, screenX: screenPos.x, screenY: screenPos.y, scale: screenPos.scale });
    }
  }
}

// ---- PLAY ANIMATION ----
let animStartTime = 0;
let animDuration = 2500;
let animPlayers = [];
let animBallPath = [];
let animResult = '';
let animYards = 0;
let animPhase = 0; // 0=running, 1=result shown

function startPlayAnimation(play) {
  animStartTime = Date.now();
  animPhase = 0;
  animPlayers = [];
  animBallPath = [];

  const difficulty = GAME_DEFS[currentGame].defDifficulty;

  if (play.type === 'run') {
    // Determine yards gained
    const base = 3 + Math.random() * 8;
    const defStop = Math.random() < difficulty ? -(2 + Math.random() * 3) : 0;
    animYards = Math.round(Math.max(-3, base + defStop));

    // Big play chance
    if (Math.random() > 0.85 - (1 - difficulty) * 0.15) {
      animYards = Math.round(15 + Math.random() * 25);
    }

    // Check for touchdown
    if (ballYard + animYards >= 100) {
      animYards = 100 - ballYard;
      animResult = 'touchdown';
    } else {
      animResult = 'complete';
    }

    animDuration = 2000;

  } else if (play.type === 'pass') {
    const isDeep = play.range === 'deep';
    const catchChance = isDeep ? (0.55 - difficulty * 0.3) : (0.75 - difficulty * 0.2);
    const intChance = isDeep ? (0.08 + difficulty * 0.1) : (0.02 + difficulty * 0.05);

    // Only allow interceptions after game 2
    const canIntercept = currentGame >= 2;

    const roll = Math.random();
    if (roll < catchChance) {
      // Complete
      animYards = isDeep ? Math.round(20 + Math.random() * 30) : Math.round(5 + Math.random() * 12);
      if (ballYard + animYards >= 100) {
        animYards = 100 - ballYard;
        animResult = 'touchdown';
      } else {
        animResult = 'complete';
      }
    } else if (canIntercept && roll > (1 - intChance)) {
      animResult = 'interception';
      animYards = 0;
    } else {
      animResult = 'incomplete';
      animYards = 0;
    }

    animDuration = isDeep ? 2800 : 2200;
  }

  // Penalty chance (game 3+)
  if (currentGame >= 2 && Math.random() < 0.12) {
    const penaltyType = Math.random() > 0.5 ? 'offsides' : 'holding';
    if (penaltyType === 'offsides' && !taughtMoments.has('penalty_offsides')) {
      animResult = 'penalty_offsides';
      animYards = 5;
      animDuration = 1500;
    } else if (penaltyType === 'holding' && Math.random() < 0.3) {
      animResult = 'penalty_holding';
      animYards = 10;
      animDuration = 1500;
    }
  }

  playSound('whistle');
  setTimeout(() => playSound('hit'), animDuration - 400);
}

function drawPlayAnimation(play) {
  const elapsed = Date.now() - animStartTime;
  const t = Math.min(1, elapsed / animDuration);

  // Move players based on play type
  ctx.save();

  // Animate offensive players forward
  for (const p of offensePlayers) {
    let dx = 0, dy = 0;
    if (p.role === 'RB' && play.type === 'run') {
      dy = t * 0.15;
      dx = play.id === 'run_left' ? -t * 0.1 : play.id === 'run_right' ? t * 0.1 : 0;
    } else if (p.role === 'WR') {
      dy = t * 0.2;
      dx = p.wx < 0 ? -t * 0.05 : t * 0.05;
    } else if (p.role === 'OL') {
      dy = t * 0.03;
    }
    drawPlayer(p.wx + dx, p.wy + dy, PATS.primary, PATS.secondary, false, p.label);
  }

  // Animate defensive players
  for (const p of defensePlayers) {
    let dy = -t * 0.04;
    drawPlayer(p.wx, p.wy + dy, SEA.primary, SEA.secondary, false, p.label);
  }

  // Ball
  if (play.type === 'pass' && t > 0.2 && t < 0.7) {
    // Ball in air
    const ballT = (t - 0.2) / 0.5;
    const targetWR = offensePlayers.find(p => p.role === 'WR');
    if (targetWR) {
      const bx = targetWR.wx + (play.range === 'deep' ? 0 : 0);
      const by = 0.2 + ballT * 0.25;
      drawBall(bx, by, true);
    }
  } else if (play.type === 'run') {
    const rb = offensePlayers.find(p => p.role === 'RB');
    if (rb) {
      const dx = play.id === 'run_left' ? -t * 0.1 : play.id === 'run_right' ? t * 0.1 : 0;
      drawBall(rb.wx + dx, rb.wy + t * 0.15, false);
    }
  }

  ctx.restore();

  // Camera shake on hit
  if (t > 0.8 && t < 0.95) {
    cameraShake = (1 - (t - 0.8) / 0.15) * 4;
  }
}

// ---- COMMENTARY SYSTEM ----
function showCommentary(pbp, color, duration) {
  commentaryQueue.push({ pbp, color, duration: duration || 4000 });
  processCommentaryQueue();
}

function processCommentaryQueue() {
  if (currentCommentary || commentaryQueue.length === 0) return;

  currentCommentary = commentaryQueue.shift();
  const bar = commentaryBar;

  pbpText.innerHTML = '<span class="espn-tag">ESPN</span>' + currentCommentary.pbp;
  if (currentCommentary.color) {
    colorText.textContent = currentCommentary.color;
    colorText.style.display = 'block';
  } else {
    colorText.style.display = 'none';
  }

  bar.classList.add('visible');
  playSound('bloop');

  commentaryTimer = setTimeout(() => {
    bar.classList.remove('visible');
    setTimeout(() => {
      currentCommentary = null;
      processCommentaryQueue();
    }, 500);
  }, currentCommentary.duration);
}

function clearCommentary() {
  clearTimeout(commentaryTimer);
  commentaryBar.classList.remove('visible');
  currentCommentary = null;
  commentaryQueue = [];
}

// ---- MOMENT CARD SYSTEM ----
function showMoment(key) {
  if (taughtMoments.has(key) || !MOMENTS[key]) return;
  taughtMoments.add(key);

  const m = MOMENTS[key];
  $('moment-emoji').textContent = m.emoji;
  $('moment-title').textContent = m.title;
  $('moment-body').innerHTML = m.body;

  dimOverlay.classList.add('visible');
  momentCard.classList.add('visible');
  gameState = 'MOMENT';
  playSound('bloop');
}

function hideMoment() {
  momentCard.classList.remove('visible');
  dimOverlay.classList.remove('visible');
}

// ---- SCOREBOARD UPDATE ----
function updateScoreboard() {
  $('pats-score').textContent = patsScore;
  $('sea-score').textContent = seaScore;

  const ordinals = ['', '1ST', '2ND', '3RD', '4TH'];
  $('down-distance').textContent = `${ordinals[down] || '4TH'} & ${yardsToGo}`;

  const mins = Math.floor(gameClock / 60);
  const secs = gameClock % 60;
  $('quarter-time').textContent = `Q${quarter} ${mins}:${secs.toString().padStart(2, '0')}`;

  $('pats-possession').classList.toggle('active', isPatsOffense);
  $('sea-possession').classList.toggle('active', !isPatsOffense);

  const gameNames = ['The Basics', 'Air It Out', 'The Full Picture', 'Clock Management', 'The Super Bowl'];
  $('game-label').textContent = `Game ${currentGame + 1} — ${gameNames[currentGame]}`;
}

// ---- PLAY CARDS ----
function showPlayCards() {
  const gameDef = GAME_DEFS[currentGame];
  let plays = [...gameDef.plays];

  // Add field goal option on 4th down if in range (game 3+)
  if (currentGame >= 2 && down === 4 && ballYard >= 55) {
    plays.push({ id: 'field_goal', name: 'Field Goal', icon: '🥅', desc: '3 points!', type: 'kick' });
  }

  playCardsEl.innerHTML = '';
  for (const play of plays) {
    const card = document.createElement('div');
    card.className = 'play-card';
    card.innerHTML = `
      <span class="card-icon">${play.icon}</span>
      <div class="card-name">${play.name}</div>
      <div class="card-desc">${play.desc}</div>
    `;
    let cardTouched = false;
    card.addEventListener('touchend', (e) => { e.preventDefault(); cardTouched = true; selectPlay(play); });
    card.addEventListener('click', () => { if (!cardTouched) selectPlay(play); cardTouched = false; });
    playCardsEl.appendChild(card);
  }

  playCardsEl.classList.add('visible');
}

function hidePlayCards() {
  playCardsEl.classList.remove('visible');
}

// ---- GAME LOGIC ----
function selectPlay(play) {
  if (gameState !== 'PLAY_CALL') return;
  selectedPlay = play;
  hidePlayCards();

  if (play.type === 'kick') {
    // Field goal attempt
    executeFieldGoal();
    return;
  }

  // Set up formation and show snap prompt
  setupFormation(play.type);
  gameState = 'SNAP_WAIT';
  snapPrompt.classList.add('visible');
}

function snapBall() {
  if (gameState !== 'SNAP_WAIT') return;
  snapPrompt.classList.remove('visible');

  if (selectedPlay.type === 'pass') {
    // Show receivers to tap
    gameState = 'PASS_TARGET';
    // Draw will highlight receivers
  } else {
    // Run play — auto execute
    gameState = 'PLAY_ACTIVE';
    startPlayAnimation(selectedPlay);
    setTimeout(() => resolvePlay(), animDuration + 200);
  }
}

function throwToReceiver(target) {
  if (gameState !== 'PASS_TARGET') return;
  throwTarget = target;
  gameState = 'PLAY_ACTIVE';
  startPlayAnimation(selectedPlay);
  setTimeout(() => resolvePlay(), animDuration + 200);
}

function executeFieldGoal() {
  gameState = 'PLAY_ACTIVE';
  const distance = 100 - ballYard + 17; // FG distance = yards to endzone + 17
  const makeChance = Math.max(0.3, 1 - distance / 60);
  const made = Math.random() < makeChance;

  showCommentary(
    `Field goal attempt from ${distance} yards...`,
    made ? "It's GOOD! Three points!" : "No good! Wide right!",
    3000
  );

  if (!taughtMoments.has('field_goal')) {
    setTimeout(() => showMoment('field_goal'), 1500);
  }

  setTimeout(() => {
    if (made) {
      patsScore += 3;
      playSound('crowd_roar');
      spawnConfetti(W / 2, H / 2);
    }
    updateScoreboard();
    advanceClock(25);
    endPossession();
  }, 2500);
}

function resolvePlay() {
  if (gameState === 'MOMENT') return; // wait for moment to clear

  gameState = 'PLAY_RESULT';

  const play = selectedPlay;
  const yards = animYards;
  const result = animResult;

  // Commentary
  const lines = getPlayCommentary(play, result, yards);
  for (const line of lines) {
    showCommentary(line.pbp, line.color, 3500);
  }

  // Teach moments based on result
  if (result === 'touchdown') {
    setTimeout(() => {
      if (!taughtMoments.has('touchdown')) {
        showMoment('touchdown');
      }
      playSound('touchdown');
      playSound('crowd_roar');
      spawnConfetti(W / 2, H * 0.4);
      cameraShake = 6;
    }, 500);

    setTimeout(() => {
      patsScore += 7; // TD + PAT simplified
      updateScoreboard();
      advanceClock(40);
      endPossession();
    }, 3000);
    return;
  }

  if (result === 'interception') {
    if (!taughtMoments.has('interception')) {
      setTimeout(() => showMoment('interception'), 800);
    }
    spawnParticles(W / 2, H * 0.4, 20, SEA.secondary, 3, 1);
    setTimeout(() => {
      advanceClock(30);
      endPossession();
    }, 2500);
    return;
  }

  if (result === 'incomplete') {
    if (!taughtMoments.has('incomplete')) {
      setTimeout(() => showMoment('incomplete'), 800);
    }
    // Don't advance ball, clock stops
    advanceClock(currentGame >= 3 ? 0 : 15);
    down++;
    checkDowns();
    return;
  }

  if (result === 'penalty_offsides') {
    if (!taughtMoments.has('penalty_offsides')) {
      setTimeout(() => showMoment('penalty_offsides'), 500);
    }
    showCommentary("Flag on the play! Offsides on the defense.", "Free 5 yards! The defense jumped early.", 3500);
    ballYard += 5;
    yardsToGo = Math.max(1, yardsToGo - 5);
    if (yardsToGo <= 0) { down = 1; yardsToGo = 10; }
    advanceClock(15);
    setTimeout(() => startNextPlay(), 2500);
    return;
  }

  if (result === 'penalty_holding') {
    if (!taughtMoments.has('penalty_holding')) {
      setTimeout(() => showMoment('penalty_holding'), 500);
    }
    showCommentary("Flag! Holding on the defense.", "10-yard penalty and an automatic first down!", 3500);
    ballYard += 10;
    down = 1;
    yardsToGo = 10;
    advanceClock(15);
    setTimeout(() => startNextPlay(), 2500);
    return;
  }

  // Normal play result
  ballYard += yards;
  yardsToGo -= yards;
  advanceClock(play.type === 'run' ? 35 : 20);

  // First down?
  if (yardsToGo <= 0) {
    down = 1;
    yardsToGo = 10;
    if (!taughtMoments.has('first_down') && currentGame >= 1) {
      setTimeout(() => showMoment('first_down'), 500);
    } else {
      showCommentary("First down!", "Fresh set of downs — 4 more chances to go 10 yards.", 2500);
    }
  } else {
    down++;
  }

  // Hit particles
  spawnParticles(W / 2, H * 0.55, 10, 'rgba(255,255,255,0.5)', 2, 0.5);

  checkDowns();
}

function checkDowns() {
  updateScoreboard();

  if (down > 4) {
    // Turnover on downs
    showCommentary("Turnover on downs!", "Couldn't get the first down in 4 tries. The Seahawks take over.", 3500);
    setTimeout(() => endPossession(), 2000);
    return;
  }

  // 4th down commentary
  if (down === 4 && currentGame >= 2) {
    const dc = getDownCommentary(down, yardsToGo, ballYard);
    if (dc) showCommentary(dc.pbp, dc.color, 3000);
  }

  // Continue drive
  setTimeout(() => startNextPlay(), 1500);
}

function advanceClock(seconds) {
  if (currentGame < 3) return; // Clock doesn't matter in early games
  gameClock = Math.max(0, gameClock - seconds);
  if (gameClock <= 120 && !taughtMoments.has('two_minute') && currentGame >= 3) {
    showMoment('two_minute');
  }
  updateScoreboard();
}

function endPossession() {
  driveCount++;
  playsThisDrive = 0;

  // Seahawks "drive" — they auto-score sometimes
  const seaScoreChance = GAME_DEFS[currentGame].defDifficulty;
  if (Math.random() < seaScoreChance) {
    const seaTD = Math.random() > 0.3;
    if (seaTD) {
      seaScore += 7;
      showCommentary("Seahawks drive down the field and SCORE!", "Touchdown Seattle. They make it look easy.", 3500);
    } else {
      seaScore += 3;
      showCommentary("Seahawks kick a field goal.", "3 points for Seattle. They couldn't punch it in.", 3000);
    }
    playSound('crowd_roar');
  } else {
    showCommentary("Seahawks go 3 and out!", "Great defensive stop! We get the ball back.", 3000);
  }

  updateScoreboard();

  // Check if game should end
  if (driveCount >= totalDrivesPerHalf * 2) {
    setTimeout(() => endGame(), 3000);
    return;
  }

  // Quarter transitions
  if (driveCount === totalDrivesPerHalf) {
    quarter = 3;
    gameClock = 900;
    showCommentary("Halftime is over! Second half begins.", "Let's see if we can keep this going!", 3000);
    updateScoreboard();
  }
  if (driveCount === Math.floor(totalDrivesPerHalf * 0.5)) {
    quarter = 2;
    gameClock = 900;
    updateScoreboard();
  }
  if (driveCount === Math.floor(totalDrivesPerHalf * 1.5)) {
    quarter = 4;
    gameClock = 900;
    updateScoreboard();
  }

  // Start new possession
  isPatsOffense = true;
  ballYard = 20 + Math.floor(Math.random() * 10);
  down = 1;
  yardsToGo = 10;

  setTimeout(() => startNextPlay(), 2500);
}

function startNextPlay() {
  if (gameState === 'MOMENT') {
    // Wait for moment card to close
    setTimeout(() => startNextPlay(), 500);
    return;
  }

  playsThisDrive++;
  updateScoreboard();

  // Teach concepts for current game
  const concepts = GAME_DEFS[currentGame].concepts;
  if (playsThisDrive === 1 && driveCount === 0) {
    // First play ever — teach fundamentals
    if (concepts.includes('field') && !taughtMoments.has('field')) {
      showMoment('field');
      setTimeout(() => {
        if (concepts.includes('offense') && !taughtMoments.has('offense')) {
          showMoment('offense');
        }
      }, 500);
    }
    if (concepts.includes('passing') && !taughtMoments.has('passing')) {
      showMoment('passing');
    }
    if (concepts.includes('downs') && !taughtMoments.has('downs') && currentGame >= 1) {
      showMoment('downs');
    }
    if (concepts.includes('clock') && !taughtMoments.has('clock')) {
      showMoment('clock');
    }
  }

  if (playsThisDrive === 2 && concepts.includes('running') && !taughtMoments.has('running')) {
    showMoment('running');
  }

  // Show play cards
  gameState = 'PLAY_CALL';
  setupFormation('run');
  showPlayCards();
}

function endGame() {
  gameState = 'GAME_OVER';
  hidePlayCards();
  scoreboardEl.classList.remove('visible');
  commentaryBar.classList.remove('visible');

  const won = patsScore > seaScore;

  $('result-emoji').textContent = won ? '🏆' : '😤';
  $('result-title').textContent = won ? 'VICTORY!' : 'DEFEAT';
  $('result-score').textContent = `${patsScore} - ${seaScore}`;

  if (won) {
    $('result-msg').textContent = currentGame < 4
      ? `Great job! You beat the Seahawks! Ready for the next challenge?`
      : `YOU WON THE SUPER BOWL! You've mastered football! 🏈`;
    $('btn-next').textContent = currentGame < 4 ? 'Next Game' : 'Play Again';
    $('btn-next').style.display = 'block';
    spawnConfetti(W / 2, H / 2);
    playSound('touchdown');
  } else {
    $('result-msg').textContent = "The Seahawks got you this time. Want to try again?";
    $('btn-next').style.display = 'none';
  }

  gameOverEl.style.display = 'flex';
  playSound('crowd_roar');
}

$('btn-next').addEventListener('click', () => {
  if (currentGame < 4) {
    currentGame++;
  } else {
    currentGame = 0;
    taughtMoments.clear();
  }
  startNewGame();
});

$('btn-replay').addEventListener('click', () => {
  startNewGame();
});

function startNewGame() {
  gameOverEl.style.display = 'none';
  patsScore = 0;
  seaScore = 0;
  down = 1;
  yardsToGo = 10;
  ballYard = 25;
  quarter = 1;
  gameClock = 900;
  driveCount = 0;
  playsThisDrive = 0;
  isPatsOffense = true;
  particles = [];

  showMatchupCard();
}

// ---- TUNNEL SEQUENCE ----
const tunnelTexts = [
  "SUPER BOWL SUNDAY",
  "From Gillette Stadium...",
  "The New England Patriots take the field!",
  "And on the other side... the Seattle Seahawks.",
  "If you're new to football — don't worry.",
  "We'll teach you everything.",
  "LET'S PLAY SOME FOOTBALL!"
];

let tunnelPhase = 0;
let tunnelStartTime = 0;
let tunnelLight = 0;

function startTunnel() {
  gameState = 'TUNNEL';
  tunnelOverlay.style.display = 'block';
  tunnelPhase = 0;
  tunnelStartTime = Date.now();
  tunnelLight = 0;
  showTunnelText(0);
  startCrowdAmbient();
}

function showTunnelText(index) {
  if (index >= tunnelTexts.length) {
    endTunnel();
    return;
  }
  tunnelPhase = index;
  const textEl = $('tunnel-text');
  textEl.classList.remove('visible');
  setTimeout(() => {
    textEl.textContent = tunnelTexts[index];
    textEl.classList.add('visible');
    // Auto-advance
    const delay = index === 0 ? 2000 : index === tunnelTexts.length - 1 ? 1500 : 2200;
    setTimeout(() => {
      textEl.classList.remove('visible');
      setTimeout(() => showTunnelText(index + 1), 400);
    }, delay);
  }, 100);
}

function drawTunnel() {
  const elapsed = (Date.now() - tunnelStartTime) / 1000;
  tunnelLight = Math.min(1, elapsed / (tunnelTexts.length * 2.5));

  tunnelCtx.fillStyle = '#000';
  tunnelCtx.fillRect(0, 0, W, H);

  // Tunnel walls
  const cx = W / 2, cy = H / 2;

  // Outer tunnel frame
  const tunnelWidth = W * 0.85;
  const tunnelHeight = H * 0.7;

  // Darkness gradient
  const outerRad = Math.max(tunnelWidth, tunnelHeight) * 0.5;
  const innerRad = outerRad * (0.1 + tunnelLight * 0.9);

  // Tunnel light at end
  const grad = tunnelCtx.createRadialGradient(cx, cy * 0.8, innerRad * 0.1, cx, cy * 0.8, innerRad);
  grad.addColorStop(0, `rgba(200, 220, 255, ${tunnelLight * 0.8})`);
  grad.addColorStop(0.3, `rgba(100, 150, 200, ${tunnelLight * 0.3})`);
  grad.addColorStop(0.7, `rgba(20, 40, 60, ${tunnelLight * 0.1})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  tunnelCtx.fillStyle = grad;
  tunnelCtx.fillRect(0, 0, W, H);

  // Tunnel arch edges
  tunnelCtx.strokeStyle = `rgba(100,100,120, ${0.2 + tunnelLight * 0.3})`;
  tunnelCtx.lineWidth = 3;
  const perspScale = 0.3 + tunnelLight * 0.7;

  // Draw receding tunnel rings
  for (let i = 0; i < 6; i++) {
    const d = (i + 1) / 7;
    const ringW = tunnelWidth * d * 0.5;
    const ringH = tunnelHeight * d * 0.5;
    const alpha = (1 - d) * 0.3 * (1 - tunnelLight);
    tunnelCtx.strokeStyle = `rgba(80,80,100, ${alpha})`;
    tunnelCtx.beginPath();
    tunnelCtx.ellipse(cx, cy * 0.85, ringW, ringH, 0, 0, TAU);
    tunnelCtx.stroke();
  }

  // When light is bright enough, show stadium glimpse
  if (tunnelLight > 0.5) {
    const fieldAlpha = (tunnelLight - 0.5) * 2;
    // Green field glimpse
    const fGrad = tunnelCtx.createRadialGradient(cx, cy, 0, cx, cy, outerRad * 0.6);
    fGrad.addColorStop(0, `rgba(46, 125, 50, ${fieldAlpha * 0.4})`);
    fGrad.addColorStop(1, 'rgba(0,0,0,0)');
    tunnelCtx.fillStyle = fGrad;
    tunnelCtx.fillRect(0, 0, W, H);
  }

  // Bright light flare when exiting
  if (tunnelLight > 0.8) {
    const flareAlpha = (tunnelLight - 0.8) * 5;
    tunnelCtx.fillStyle = `rgba(255,255,255, ${Math.min(1, flareAlpha)})`;
    tunnelCtx.fillRect(0, 0, W, H);
  }
}

function endTunnel() {
  // Flash white and transition
  const flash = document.createElement('div');
  flash.className = 'screen-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);

  tunnelOverlay.style.display = 'none';
  showMatchupCard();
}

function skipTunnel() {
  tunnelOverlay.style.display = 'none';
  showMatchupCard();
}

// ---- MATCHUP CARD ----
function showMatchupCard() {
  $('mc-game-label').textContent = `Game ${currentGame + 1} of 5`;
  matchupCard.style.display = 'flex';
  gameState = 'MATCHUP';
  setCrowdVolume(0.5);
}

function dismissMatchupCard() {
  matchupCard.style.display = 'none';
  startGameplay();
}

function startGameplay() {
  gameState = 'PLAY_CALL';
  scoreboardEl.classList.add('visible');
  updateScoreboard();

  // Intro commentary
  const intro = GAME_DEFS[currentGame].introCommentary;
  for (const line of intro) {
    showCommentary(line.pbp, line.color, 4000);
  }

  // Setup and show play cards
  setupFormation('run');
  setTimeout(() => {
    showPlayCards();
  }, 1500);
}

// ---- TOUCH INPUT ----
let lastTouchTime = 0;
document.addEventListener('touchstart', (e) => { lastTouchTime = Date.now(); handleTouch(e); }, { passive: false });
document.addEventListener('click', (e) => { if (Date.now() - lastTouchTime < 500) return; handleTouch(e); });

function handleTouch(e) {
  // Initialize audio on first touch
  if (!audioUnlocked) {
    initAudio();
  }

  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX, y = touch.clientY;

  if (gameState === 'TITLE') {
    e.preventDefault();
    titleScreen.style.display = 'none';
    startTunnel();
    return;
  }

  if (gameState === 'TUNNEL') {
    e.preventDefault();
    skipTunnel();
    return;
  }

  if (gameState === 'MATCHUP') {
    e.preventDefault();
    dismissMatchupCard();
    return;
  }

  if (gameState === 'MOMENT') {
    e.preventDefault();
    hideMoment();
    // Return to previous state
    gameState = 'PLAY_RESULT';
    setTimeout(() => {
      if (gameState === 'PLAY_RESULT') {
        // Check if we need to continue
        startNextPlay();
      }
    }, 300);
    return;
  }

  if (gameState === 'SNAP_WAIT') {
    e.preventDefault();
    snapBall();
    return;
  }

  if (gameState === 'PASS_TARGET') {
    // Check if they tapped a receiver
    for (const rt of receiverTargets) {
      const dx = x - rt.screenX;
      const dy = y - rt.screenY;
      if (Math.sqrt(dx*dx + dy*dy) < 40) {
        e.preventDefault();
        throwToReceiver(rt);
        return;
      }
    }
    return;
  }
}

// ---- MAIN RENDER LOOP ----
function render(time) {
  const dt = Math.min(0.05, (time - (lastFrameTime || time)) / 1000);
  lastFrameTime = time;

  // Clear
  ctx.clearRect(0, 0, W, H);

  // Camera shake
  if (cameraShake > 0) {
    ctx.save();
    ctx.translate(
      (Math.random() - 0.5) * cameraShake,
      (Math.random() - 0.5) * cameraShake
    );
    cameraShake *= 0.9;
    if (cameraShake < 0.1) cameraShake = 0;
  }

  // Draw field always (behind everything)
  if (gameState !== 'TITLE' && gameState !== 'TUNNEL') {
    drawField();

    // Draw players based on game state
    if (gameState === 'PLAY_CALL' || gameState === 'SNAP_WAIT') {
      drawFormation(false);
      drawBall(0, 0.22, false);
    } else if (gameState === 'PASS_TARGET') {
      drawFormation(true);
      drawBall(0, 0.22, false);
    } else if (gameState === 'PLAY_ACTIVE') {
      drawPlayAnimation(selectedPlay);
    } else if (gameState === 'PLAY_RESULT') {
      drawFormation(false);
    } else {
      drawFormation(false);
    }

    drawParticles();
  }

  // Tunnel rendering
  if (gameState === 'TUNNEL') {
    drawTunnel();
  }

  if (cameraShake > 0) {
    ctx.restore();
  }

  // Update particles
  updateParticles(dt);

  requestAnimationFrame(render);
}

// ---- START ----
requestAnimationFrame(render);

})();
</script>
