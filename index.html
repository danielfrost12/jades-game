<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jade's Game</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Patriots */
  --pats-navy: #002244;
  --pats-red: #C60C30;
  --pats-silver: #B0B7BC;
  /* Seahawks */
  --sea-navy: #002244;
  --sea-green: #69BE28;
  --sea-gray: #A5ACAF;
  /* ESPN */
  --espn-red: #CC0000;
  --espn-dark: #1a1a1a;
  /* Field */
  --field-green: #2E7D32;
  --field-light: #388E3C;
  --field-dark: #1B5E20;
  /* UI */
  --glass-bg: rgba(0,0,0,0.75);
  --glass-border: rgba(255,255,255,0.12);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.7);
  --gold: #FFD700;
}

html, body {
  width: 100%; height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  color: var(--text-primary);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

canvas#game {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}

/* ======= UI OVERLAY ======= */
#ui-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#ui-overlay > * { pointer-events: auto; }

/* ======= COMMENTARY BAR ======= */
#commentary-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px 12px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 60%, rgba(0,0,0,0.4) 85%, transparent 100%);
  opacity: 0;
  transform: translateY(-20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  pointer-events: none;
}
#commentary-bar.visible {
  opacity: 1;
  transform: translateY(0);
}
#commentary-bar .play-by-play {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.35;
}
#commentary-bar .color-commentary {
  font-size: 13px;
  font-weight: 400;
  color: var(--gold);
  line-height: 1.35;
  font-style: italic;
}
#commentary-bar .espn-tag {
  display: inline-block;
  background: var(--espn-red);
  color: white;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 2px;
  margin-right: 6px;
  letter-spacing: 0.5px;
  vertical-align: middle;
}

/* ======= SCOREBOARD ======= */
#scoreboard {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 8px 16px calc(env(safe-area-inset-bottom, 34px) + 4px) 16px;
  background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0.4) 85%, transparent 100%);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
#scoreboard.visible {
  opacity: 1;
  transform: translateY(0);
}

.score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
}
.team-score {
  display: flex;
  align-items: center;
  gap: 8px;
}
.team-logo {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900;
  font-size: 11px;
  letter-spacing: -0.5px;
}
.team-logo.pats { background: var(--pats-navy); border: 2px solid var(--pats-red); }
.team-logo.sea { background: var(--sea-green); border: 2px solid var(--sea-navy); }
.team-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.team-pts {
  font-size: 32px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  min-width: 40px;
  text-align: right;
}
.possession-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  margin-left: 6px;
  opacity: 0;
  transition: opacity 0.3s;
}
.possession-dot.active { opacity: 1; }

.game-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 4px;
  border-top: 1px solid var(--glass-border);
  margin-top: 4px;
}
.down-distance {
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
}
.yard-line {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.quarter-time {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.game-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  text-align: center;
  padding-bottom: 4px;
}
.skip-btn {
  position: absolute;
  top: 6px;
  right: 8px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.6);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  z-index: 5;
}
.skip-btn:active {
  background: rgba(255,255,255,0.25);
  color: #fff;
}

/* ======= PLAY CARDS ======= */
#play-cards {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 34px) + 165px);
  left: 16px; right: 16px;
  display: flex;
  gap: 10px;
  justify-content: center;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}
#play-cards.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.play-card {
  flex: 1;
  max-width: 115px;
  min-height: 110px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  padding: 16px 10px 14px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.play-card:active {
  transform: scale(0.93);
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.35);
}
.play-card .card-icon {
  font-size: 30px;
  margin-bottom: 8px;
  display: block;
}
.play-card .card-name {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.play-card .card-desc {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.3;
}

/* ======= MOMENT CARD (teaching popup) ======= */
#moment-card {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: calc(100% - 40px);
  max-width: 353px;
  background: rgba(18,18,18,0.96);
  backdrop-filter: blur(40px) saturate(1.5);
  -webkit-backdrop-filter: blur(40px) saturate(1.5);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px;
  padding: 28px 24px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease, transform 0.35s ease;
  z-index: 20;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
#moment-card.visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: auto;
}
#moment-card .moment-emoji {
  font-size: 52px;
  margin-bottom: 14px;
  display: block;
}
#moment-card .moment-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
#moment-card .moment-body {
  font-size: 15px;
  line-height: 1.55;
  color: var(--text-secondary);
  margin-bottom: 18px;
}
#moment-card .moment-body strong {
  color: var(--gold);
  font-weight: 700;
}
#moment-card .moment-tap {
  font-size: 12px;
  color: var(--text-secondary);
  opacity: 0.6;
}

/* ======= TITLE SCREEN ======= */
#title-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  background: #000;
}
#title-screen .title-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 30%, rgba(204,0,0,0.15) 0%, transparent 60%),
              radial-gradient(ellipse at 50% 70%, rgba(0,34,68,0.3) 0%, transparent 50%);
}
#title-screen .title-content {
  position: relative;
  z-index: 1;
  text-align: center;
}
#title-screen h1 {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  background: linear-gradient(180deg, #fff 0%, #B0B7BC 50%, #6a6a6a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  text-shadow: none;
}
#title-screen .subtitle {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--pats-red);
  margin-bottom: 40px;
}
#title-screen .matchup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 50px;
}
#title-screen .matchup-team {
  text-align: center;
}
#title-screen .matchup-team .helmet {
  width: 60px; height: 60px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 8px;
  border: 3px solid rgba(255,255,255,0.2);
}
#title-screen .matchup-team .helmet.pats { background: var(--pats-navy); border-color: var(--pats-red); }
#title-screen .matchup-team .helmet.sea { background: var(--sea-navy); border-color: var(--sea-green); }
#title-screen .matchup-team .tname {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#title-screen .vs-text {
  font-size: 24px;
  font-weight: 900;
  color: var(--text-secondary);
}
#title-screen .tap-start {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-primary);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.stadium-lights {
  position: absolute;
  top: -20%; left: 50%;
  transform: translateX(-50%);
  width: 200%;
  height: 50%;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, transparent 70%);
  animation: lightSweep 4s ease-in-out infinite alternate;
}
@keyframes lightSweep {
  0% { transform: translateX(-60%); }
  100% { transform: translateX(-40%); }
}

/* ======= TUNNEL OVERLAY ======= */
#tunnel-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 90;
  background: #000;
  display: none;
  overflow: hidden;
}
#tunnel-overlay canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
#tunnel-overlay .tunnel-text {
  position: absolute;
  bottom: 15%;
  left: 0; right: 0;
  text-align: center;
  padding: 0 24px;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.6;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#tunnel-overlay .tunnel-text.visible { opacity: 1; }
#tunnel-overlay .tunnel-skip {
  position: absolute;
  top: calc(env(safe-area-inset-top, 12px) + 12px);
  right: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  opacity: 0.5;
  padding: 8px;
}

/* ======= GAME OVER SCREEN ======= */
#game-over {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 80;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  text-align: center;
  padding: 24px;
}
#game-over .result-emoji { font-size: 64px; margin-bottom: 16px; }
#game-over .result-title {
  font-size: 32px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
#game-over .result-score {
  font-size: 48px;
  font-weight: 900;
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
#game-over .result-msg {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 32px;
  max-width: 280px;
}
#game-over .btn {
  padding: 14px 32px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: none;
  cursor: pointer;
  margin: 6px 0;
  width: 220px;
  -webkit-tap-highlight-color: transparent;
}
#game-over .btn-primary {
  background: var(--pats-red);
  color: white;
}
#game-over .btn-secondary {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid var(--glass-border);
}

/* ======= SNAP PROMPT ======= */
#snap-prompt {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 34px) + 290px);
  left: 0; right: 0;
  text-align: center;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
#snap-prompt.visible { opacity: 1; pointer-events: auto; }
#snap-prompt .snap-text {
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 4px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  animation: pulse 1.5s ease-in-out infinite;
}

/* ======= RECEIVER MARKERS ======= */
.receiver-marker {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  background: rgba(255,215,0,0.15);
  transform: translate(-50%, -50%);
  animation: receiverPulse 1s ease-in-out infinite;
  cursor: pointer;
  z-index: 15;
}
@keyframes receiverPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); }
  50% { box-shadow: 0 0 0 12px rgba(255,215,0,0); }
}

/* ======= SCREEN FLASH ======= */
.screen-flash {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: white;
  z-index: 200;
  pointer-events: none;
  animation: flash 0.6s ease-out forwards;
}
@keyframes flash {
  0% { opacity: 0.8; }
  100% { opacity: 0; }
}

/* ======= DARK OVERLAY FOR DIMMING ======= */
#dim-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#dim-overlay.visible { opacity: 1; pointer-events: auto; }

/* ======= INTRO MATCHUP CARD ======= */
#matchup-card {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 85;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.85);
  text-align: center;
}
#matchup-card .mc-espn {
  background: var(--espn-red);
  color: white;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 3px;
  letter-spacing: 2px;
  margin-bottom: 24px;
}
#matchup-card .mc-teams {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 24px;
}
#matchup-card .mc-team {
  text-align: center;
}
#matchup-card .mc-helmet {
  width: 72px; height: 72px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin: 0 auto 10px;
  border: 3px solid rgba(255,255,255,0.2);
}
#matchup-card .mc-helmet.pats { background: var(--pats-navy); border-color: var(--pats-red); }
#matchup-card .mc-helmet.sea { background: var(--sea-navy); border-color: var(--sea-green); }
#matchup-card .mc-tname {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#matchup-card .mc-record {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
}
#matchup-card .mc-vs {
  font-size: 28px;
  font-weight: 900;
  color: var(--text-secondary);
}
#matchup-card .mc-game-label {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 40px;
}
#matchup-card .mc-tap {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: pulse 2s ease-in-out infinite;
}
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <div class="stadium-lights"></div>
  <div class="title-bg"></div>
  <div class="title-content">
    <h1>Jade's Game</h1>
    <div class="subtitle">Learn Football</div>
    <div class="matchup">
      <div class="matchup-team">
        <div class="helmet pats">🏈</div>
        <div class="tname">Patriots</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="matchup-team">
        <div class="helmet sea">🦅</div>
        <div class="tname">Seahawks</div>
      </div>
    </div>
    <div class="tap-start">Tap to Start</div>
  </div>
</div>

<!-- TUNNEL SEQUENCE -->
<div id="tunnel-overlay">
  <canvas id="tunnel-canvas"></canvas>
  <div class="tunnel-text" id="tunnel-text"></div>
  <div class="tunnel-skip">TAP TO SKIP</div>
</div>

<!-- MATCHUP CARD -->
<div id="matchup-card">
  <div class="mc-espn">ESPN</div>
  <div class="mc-game-label" id="mc-game-label">Game 1 of 5</div>
  <div class="mc-teams">
    <div class="mc-team">
      <div class="mc-helmet pats">🏈</div>
      <div class="mc-tname">Patriots</div>
      <div class="mc-record">You</div>
    </div>
    <div class="mc-vs">VS</div>
    <div class="mc-team">
      <div class="mc-helmet sea">🦅</div>
      <div class="mc-tname">Seahawks</div>
      <div class="mc-record">CPU</div>
    </div>
  </div>
  <div class="mc-tap">Tap to Play</div>
</div>

<!-- GAME CANVAS -->
<canvas id="game"></canvas>

<!-- UI OVERLAY -->
<div id="ui-overlay">
  <!-- Commentary Bar -->
  <div id="commentary-bar">
    <div class="play-by-play" id="pbp-text"></div>
    <div class="color-commentary" id="color-text"></div>
  </div>

  <!-- Snap Prompt -->
  <div id="snap-prompt">
    <div class="snap-text">TAP TO SNAP</div>
  </div>

  <!-- Play Cards -->
  <div id="play-cards"></div>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <div class="game-label" id="game-label">Game 1 — The Basics</div>
    <button class="skip-btn" id="skip-game">SKIP &raquo;</button>
    <div class="score-row">
      <div class="team-score">
        <div class="team-logo pats">NE</div>
        <div class="team-name">Patriots</div>
        <div class="possession-dot" id="pats-possession"></div>
      </div>
      <div class="team-pts" id="pats-score">0</div>
    </div>
    <div class="score-row">
      <div class="team-score">
        <div class="team-logo sea">SEA</div>
        <div class="team-name">Seahawks</div>
        <div class="possession-dot" id="sea-possession"></div>
      </div>
      <div class="team-pts" id="sea-score">0</div>
    </div>
    <div class="game-info">
      <div class="down-distance" id="down-distance">1ST & 10</div>
      <div class="yard-line" id="yard-line">OWN 25</div>
      <div class="quarter-time" id="quarter-time">Q1 5:00</div>
    </div>
  </div>
</div>

<!-- Dim overlay for moment cards -->
<div id="dim-overlay"></div>

<!-- Moment Card (teaching) -->
<div id="moment-card">

function fillTemplate(str, vars) {
  return str.replace(/\{(\w+)\}/g, (_, key) => vars[key] !== undefined ? vars[key] : '');
}

function getPlayCommentary(play, result, yards) {
  const vars = { yards: Math.abs(yards) };
  let pool;

  if (result === 'touchdown') {
    pool = COMMENTARY.TD;
  } else if (result === 'interception') {
    pool = COMMENTARY.INTERCEPTION;
  } else if (result === 'incomplete') {
    pool = COMMENTARY.INCOMPLETE;
  } else if (play.type === 'run') {
    if (yards > 15) pool = COMMENTARY.RUN_BIG;
    else if (yards > 5) pool = COMMENTARY.RUN_GOOD;
    else if (yards > 0) pool = COMMENTARY.RUN_SHORT;
    else pool = COMMENTARY.RUN_LOSS;
  } else if (play.type === 'pass') {
    if (yards > 25) pool = COMMENTARY.PASS_DEEP_COMPLETE;
    else if (yards > 10) pool = COMMENTARY.PASS_GOOD;
    else pool = COMMENTARY.PASS_SHORT;
  }

  if (!pool) return [];
  const line = pickRandom(pool);
  return [{ pbp: fillTemplate(line.pbp, vars), color: fillTemplate(line.color, vars) }];
}

}

// ---- AUDIO ENGINE ----
function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioUnlocked = true;
  } catch(e) { /* no audio support */ }
}

// Master volume node — all sounds route through this
let masterGain = null;
function getMaster() {
  if (!masterGain && audioCtx) {
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.8;
    masterGain.connect(audioCtx.destination);
  }
  return masterGain || audioCtx.destination;
}

function playSound(type) {
  if (!audioCtx || !audioUnlocked) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const dest = getMaster();
  try {
    const now = audioCtx.currentTime;

    if (type === 'whistle') {
      // Referee whistle: two-tone chirp, louder and more realistic
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(3400, now);
      osc1.frequency.linearRampToValueAtTime(2900, now + 0.15);
      osc1.frequency.setValueAtTime(3400, now + 0.15);
      osc1.frequency.linearRampToValueAtTime(2900, now + 0.35);
      osc2.frequency.setValueAtTime(3450, now);
      osc2.frequency.linearRampToValueAtTime(2950, now + 0.35);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.setValueAtTime(0.25, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(dest);
      osc1.start(now); osc1.stop(now + 0.5);
      osc2.start(now); osc2.stop(now + 0.5);

    } else if (type === 'hit') {
      // Tackle impact: deep thump + body collision crack
      // Low thump
      const bufSize = Math.floor(audioCtx.sampleRate * 0.25);
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.06));
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const lpf = audioCtx.createBiquadFilter();
      lpf.type = 'lowpass'; lpf.frequency.value = 300;
      const g1 = audioCtx.createGain();
      g1.gain.setValueAtTime(0.6, now);
      g1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      src.connect(lpf).connect(g1).connect(dest);
      src.start(now);
      // Higher crack
      const osc = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
      g2.gain.setValueAtTime(0.35, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(g2).connect(dest);
      osc.start(now); osc.stop(now + 0.15);

    } else if (type === 'touchdown') {
      // Stadium horn: deep foghorn chord, longer and louder
      const freqs = [130.81, 164.81, 196.0, 261.63]; // C3, E3, G3, C4
      freqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
        gain.gain.setValueAtTime(0.12, now + 0.8);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        osc.connect(gain).connect(dest);
        osc.start(now);
        osc.stop(now + 1.5);
      });
      // Add sub bass thump
      const sub = audioCtx.createOscillator();
      const subG = audioCtx.createGain();
      sub.type = 'sine'; sub.frequency.value = 55;
      subG.gain.setValueAtTime(0.2, now);
      subG.gain.setValueAtTime(0.2, now + 0.6);
      subG.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      sub.connect(subG).connect(dest);
      sub.start(now); sub.stop(now + 1.2);

    } else if (type === 'crowd_roar') {
      // Crowd eruption: layered noise through multiple bandpass filters
      // to simulate many voices at different pitches
      const bands = [
        { freq: 400, Q: 0.8, vol: 0.12 },
        { freq: 800, Q: 0.6, vol: 0.10 },
        { freq: 1200, Q: 1.0, vol: 0.06 },
        { freq: 2000, Q: 1.5, vol: 0.03 },
      ];
      const bufSize = Math.floor(audioCtx.sampleRate * 2.5);
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      // Brownian noise (smoother, less hissy)
      let last = 0;
      for (let i = 0; i < bufSize; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + (0.02 * white)) / 1.02;
        data[i] = last * 3.5;
      }
      bands.forEach(band => {
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const bpf = audioCtx.createBiquadFilter();
        bpf.type = 'bandpass'; bpf.frequency.value = band.freq; bpf.Q.value = band.Q;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(band.vol, now + 0.15);
        g.gain.setValueAtTime(band.vol, now + 1.0);
        g.gain.linearRampToValueAtTime(band.vol * 0.6, now + 1.8);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        src.connect(bpf).connect(g).connect(dest);
        src.start(now);
      });

    } else if (type === 'bloop') {
      // ESPN commentary notification — clean, clear double-tone
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046, now); // C6
      osc.frequency.setValueAtTime(1318, now + 0.06); // E6
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.setValueAtTime(0.15, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain).connect(dest);
      osc.start(now);
      osc.stop(now + 0.15);

    } else if (type === 'crowd_ambient') {
      // Stadium crowd ambiance: layered brownian noise through multiple
      // frequency bands to simulate thousands of voices murmuring
      const bufSize = Math.floor(audioCtx.sampleRate * 4);
      const buffer = audioCtx.createBuffer(2, bufSize, audioCtx.sampleRate);
      // Fill both channels with different brownian noise for stereo width
      for (let ch = 0; ch < 2; ch++) {
        const data = buffer.getChannelData(ch);
        let v = 0;
        for (let i = 0; i < bufSize; i++) {
          v = (v + (0.02 * (Math.random() * 2 - 1))) / 1.02;
          data[i] = v * 3.5;
        }
      }

      // Create a mixer node for the crowd layers
      const crowdMix = audioCtx.createGain();
      crowdMix.gain.value = 0.04; // start quiet
      crowdMix.connect(dest);

      // Layer 1: Low murmur (male voices)
      const src1 = audioCtx.createBufferSource();
      src1.buffer = buffer; src1.loop = true;
      const bp1 = audioCtx.createBiquadFilter();
      bp1.type = 'bandpass'; bp1.frequency.value = 250; bp1.Q.value = 0.5;
      const g1 = audioCtx.createGain(); g1.gain.value = 0.7;
      src1.connect(bp1).connect(g1).connect(crowdMix);

      // Layer 2: Mid murmur (general crowd hum)
      const src2 = audioCtx.createBufferSource();
      src2.buffer = buffer; src2.loop = true;
      // Slight detune for natural feel
      src2.playbackRate.value = 1.07;
      const bp2 = audioCtx.createBiquadFilter();
      bp2.type = 'bandpass'; bp2.frequency.value = 500; bp2.Q.value = 0.7;
      const g2 = audioCtx.createGain(); g2.gain.value = 0.5;
      src2.connect(bp2).connect(g2).connect(crowdMix);

      // Layer 3: Higher crowd chatter
      const src3 = audioCtx.createBufferSource();
      src3.buffer = buffer; src3.loop = true;
      src3.playbackRate.value = 0.93;
      const bp3 = audioCtx.createBiquadFilter();
      bp3.type = 'bandpass'; bp3.frequency.value = 900; bp3.Q.value = 1.0;
      const g3 = audioCtx.createGain(); g3.gain.value = 0.25;
      src3.connect(bp3).connect(g3).connect(crowdMix);

      // Layer 4: Subtle high presence (clapping, rustling)
      const src4 = audioCtx.createBufferSource();
      src4.buffer = buffer; src4.loop = true;
      src4.playbackRate.value = 1.15;
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 2000;
      const g4 = audioCtx.createGain(); g4.gain.value = 0.08;
      src4.connect(hp).connect(g4).connect(crowdMix);

      // Slow volume modulation (crowd sways in and out)
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.type = 'sine'; lfo.frequency.value = 0.15; // very slow
      lfoGain.gain.value = 0.01; // subtle
      lfo.connect(lfoGain).connect(crowdMix.gain);
      lfo.start();

      src1.start(); src2.start(); src3.start(); src4.start();
      return { sources: [src1, src2, src3, src4], gain: crowdMix, lfo };

    } else if (type === 'snap') {
      // Ball snap sound: quick percussive hit
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain).connect(dest);
      osc.start(now); osc.stop(now + 0.1);

    } else if (type === 'crowd_groan') {
      // Crowd disappointment: lower pitched swell down
      const bufSize = Math.floor(audioCtx.sampleRate * 1.5);
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let v = 0;
      for (let i = 0; i < bufSize; i++) { v = (v + 0.02 * (Math.random() * 2 - 1)) / 1.02; data[i] = v * 3.5; }
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const bpf = audioCtx.createBiquadFilter();
      bpf.type = 'bandpass'; bpf.frequency.value = 300; bpf.Q.value = 0.5;
      bpf.frequency.linearRampToValueAtTime(180, now + 1.2);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.1, now + 0.2);
      g.gain.linearRampToValueAtTime(0.06, now + 0.8);
      g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
      src.connect(bpf).connect(g).connect(dest);
      src.start(now);
    }
  } catch(e) { /* audio error */ }
}

function startCrowdAmbient() {
  if (!crowdAmbient && audioCtx) crowdAmbient = playSound('crowd_ambient');
}
function setCrowdVolume(v) {
  if (crowdAmbient && crowdAmbient.gain) {
    try {
      const target = clamp(v, 0, 1) * 0.08;
      crowdAmbient.gain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 0.5);
    } catch(e) {}
  }
}

// ---- PARTICLE SYSTEM ----
function spawnParticles(x, y, count, color, speed, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TAU;
    const spd = speed * (0.5 + Math.random() * 0.5);
    particles.push({
      x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - speed * 0.5,
      life: life * (0.5 + Math.random() * 0.5), maxLife: life,
      color, size: 2 + Math.random() * 4, gravity: 0.15
    });
  }
}

function spawnConfetti(x, y) {
  const colors = ['#C60C30', '#002244', '#FFD700', '#FFFFFF', '#B0B7BC'];
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * TAU;
    const spd = 2 + Math.random() * 6;
    particles.push({
      x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - 4,
      life: 2 + Math.random() * 2, maxLife: 3,
      color: pickRandom(colors), size: 3 + Math.random() * 5, gravity: 0.08,
      rotation: Math.random() * TAU, rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life -= dt;
    if (p.rotation !== undefined) p.rotation += p.rotSpeed;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    if (p.rotation !== undefined) {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---- CROWD PRE-GENERATION ----
let crowdDots = null;
function generateCrowd() {
  crowdDots = [];
  for (let row = 0; row < 8; row++) {
    const density = 40 + row * 5;
    for (let i = 0; i < density; i++) {
      crowdDots.push({
        row, xPct: i / density,
        xJitter: (Math.random() - 0.5) * 4, yJitter: (Math.random() - 0.5) * 2,
        brightness: 0.15 + Math.random() * 0.15, isPatsFan: Math.random() > 0.5,
        dotSize: 1.5 + row * 0.3
      });
    }
  }
}
generateCrowd();

// ---- FIELD RENDERER ----
function worldToScreen(wx, wy) {
  const horizon = H * 0.28;
  const fov = 1.2;
  const d = 0.1 + wy * fov;
  const sy = horizon + (H - horizon) * (0.1 / d);
  const scale = (H - sy) / (H - horizon);
  const sx = W / 2 + wx * W * 0.6 * (1 - wy * 0.7);
  return { x: sx, y: sy, scale: Math.max(0.1, scale) };
}

function drawField() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.35);
  skyGrad.addColorStop(0, '#0a0a15');
  skyGrad.addColorStop(0.5, '#111128');
  skyGrad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.35);

  for (let i = 0; i < 5; i++) {
    const lx = W * (0.1 + i * 0.2), ly = H * 0.02;
    const grad = ctx.createRadialGradient(lx, ly, 0, lx, ly, H * 0.25);
    grad.addColorStop(0, 'rgba(255,255,200,0.12)');
    grad.addColorStop(0.5, 'rgba(255,255,200,0.03)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(lx - H * 0.25, ly, H * 0.5, H * 0.3);
  }

  const horizon = H * 0.28;
  const crowdTop = H * 0.05;
  if (crowdDots) {
    for (const dot of crowdDots) {
      const y = crowdTop + dot.row * (horizon - crowdTop) / 8;
      const x = dot.xPct * W;
      ctx.fillStyle = dot.isPatsFan
        ? `rgba(0,34,68,${dot.brightness})`
        : `rgba(105,190,40,${dot.brightness * 0.8})`;
      ctx.fillRect(x + dot.xJitter, y + dot.yJitter, dot.dotSize, dot.dotSize * 1.5);
    }
  }

  const fieldTop = horizon;
  const fieldGrad = ctx.createLinearGradient(0, fieldTop, 0, H);
  fieldGrad.addColorStop(0, '#1B5E20');
  fieldGrad.addColorStop(0.3, '#2E7D32');
  fieldGrad.addColorStop(1, '#388E3C');
  ctx.fillStyle = fieldGrad;
  ctx.fillRect(0, fieldTop, W, H - fieldTop);

  const baseYard = Math.floor(ballYard / 5) * 5;
  for (let yd = -20; yd <= 60; yd += 5) {
    const worldY = (yd + 20) / 80;
    const sp = worldToScreen(0, worldY);
    if (sp.y < fieldTop || sp.y > H) continue;
    const lineAlpha = Math.max(0.1, 1 - worldY * 0.9);
    ctx.strokeStyle = `rgba(255,255,255,${lineAlpha * 0.6})`;
    ctx.lineWidth = Math.max(0.5, (1 - worldY) * 2);
    ctx.beginPath();
    const left = worldToScreen(-1, worldY);
    const right = worldToScreen(1, worldY);
    ctx.moveTo(left.x, sp.y);
    ctx.lineTo(right.x, sp.y);
    ctx.stroke();

    const actualYard = baseYard + yd;
    if (actualYard % 10 === 0 && actualYard >= 0 && actualYard <= 100) {
      const displayNum = actualYard <= 50 ? actualYard : 100 - actualYard;
      if (displayNum > 0 && lineAlpha > 0.3) {
        ctx.fillStyle = `rgba(255,255,255,${lineAlpha * 0.4})`;
        ctx.font = `${Math.max(8, 14 * (1 - worldY))}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(displayNum, worldToScreen(-0.85, worldY).x, sp.y - 2);
        ctx.fillText(displayNum, worldToScreen(0.85, worldY).x, sp.y - 2);
      }
    }
  }

  // Grass stripes
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  for (let yd = -20; yd <= 60; yd += 10) {
    const y1 = worldToScreen(0, (yd + 20) / 80).y;
    const y2 = worldToScreen(0, (yd + 25) / 80).y;
    if (y1 > H || y2 < fieldTop) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, Math.min(y1, y2), W, Math.abs(y2 - y1));
  }
  ctx.restore();

  // End zone
  const ezFarTop = worldToScreen(0, 0.9).y;
  if (ezFarTop < H) {
    ctx.fillStyle = 'rgba(105,190,40,0.15)';
    ctx.fillRect(0, Math.max(fieldTop, ezFarTop), W, H * 0.05);
    const sp = worldToScreen(0, 0.92);
    if (sp.y > fieldTop) {
      ctx.fillStyle = 'rgba(105,190,40,0.2)';
      ctx.font = 'bold 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SEAHAWKS', sp.x, sp.y);
    }
  }

  // Line of scrimmage
  const losWorld = 0.25;
  const losScreen = worldToScreen(0, losWorld);
  const losLeft = worldToScreen(-1, losWorld);
  const losRight = worldToScreen(1, losWorld);
  ctx.strokeStyle = 'rgba(0,136,255,0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(losLeft.x, losScreen.y);
  ctx.lineTo(losRight.x, losScreen.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // First down line
  if (yardsToGo > 0 && down <= 4) {
    const fdWorld = losWorld + (yardsToGo / 80);
    if (fdWorld < 1) {
      const fdScreen = worldToScreen(0, fdWorld);
      const fdLeft = worldToScreen(-1, fdWorld);
      const fdRight = worldToScreen(1, fdWorld);
      ctx.strokeStyle = 'rgba(255,215,0,0.6)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(fdLeft.x, fdScreen.y);
      ctx.lineTo(fdRight.x, fdScreen.y);
      ctx.stroke();
    }
  }

  // Sidelines
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(worldToScreen(-0.95, 0).x, worldToScreen(-0.95, 0).y);
  ctx.lineTo(worldToScreen(-0.95, 1).x, worldToScreen(-0.95, 1).y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(worldToScreen(0.95, 0).x, worldToScreen(0.95, 0).y);
  ctx.lineTo(worldToScreen(0.95, 1).x, worldToScreen(0.95, 1).y);
  ctx.stroke();
}

// ---- PLAYER RENDERER ----
function drawPlayer(wx, wy, teamColor, accentColor, isHighlighted, label) {
  const sp = worldToScreen(wx, wy);
  const s = sp.scale * 1.2;
  const px = sp.x, py = sp.y;

  if (py < H * 0.2 || py > H + 20) return null;

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py + 2 * s, 8 * s, 3 * s, 0, 0, TAU);
  ctx.fill();

  ctx.fillStyle = teamColor;
  ctx.beginPath();
  ctx.ellipse(px, py - 10 * s, 7 * s, 12 * s, 0, 0, TAU);
  ctx.fill();

  ctx.fillStyle = accentColor;
  ctx.fillRect(px - 5 * s, py - 14 * s, 10 * s, 3 * s);

  ctx.fillStyle = teamColor;
  ctx.beginPath();
  ctx.arc(px, py - 22 * s, 6 * s, 0, TAU);
  ctx.fill();

  ctx.fillStyle = 'rgba(180,180,180,0.6)';
  ctx.fillRect(px - 3 * s, py - 20 * s, 6 * s, 2 * s);

  if (isHighlighted) {
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(px, py, 12 * s, 5 * s, 0, 0, TAU);
    ctx.stroke();
    const pulseSize = 14 + Math.sin(Date.now() / 200) * 4;
    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px, py, pulseSize * s, pulseSize * 0.4 * s, 0, 0, TAU);
    ctx.stroke();
  }

  if (label && s > 0.3) {
    ctx.fillStyle = 'white';
    ctx.font = `bold ${Math.max(7, 10 * s)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(label, px, py - 6 * s);
  }

  return { x: px, y: py, scale: s };
}

function drawBall(wx, wy, airborne) {
  const sp = worldToScreen(wx, wy);
  const s = sp.scale;
  ctx.save();
  if (airborne) {
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y - 30 * s, 5 * s, 3 * s, -0.3, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sp.x - 2 * s, sp.y - 31 * s);
    ctx.lineTo(sp.x + 2 * s, sp.y - 31 * s);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2 * s;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y - 30 * s);
    ctx.lineTo(sp.x - 15 * s, sp.y - 20 * s);
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y - 14 * s, 4 * s, 2.5 * s, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

// ---- PLAY ANIMATION ----
function startPlayAnimation(play) {
  animStartTime = Date.now();

  const difficulty = GAME_DEFS[currentGame].defDifficulty;

  if (play.type === 'run') {
    const base = 3 + Math.random() * 8;
    const defStop = Math.random() < difficulty ? -(2 + Math.random() * 3) : 0;
    animYards = Math.round(Math.max(-3, base + defStop));
    if (Math.random() > 0.85 - (1 - difficulty) * 0.15) animYards = Math.round(15 + Math.random() * 25);
    if (ballYard + animYards >= 100) { animYards = 100 - ballYard; animResult = 'touchdown'; }
    else animResult = 'complete';
    animDuration = 2000;
  } else if (play.type === 'pass') {
    const isDeep = play.range === 'deep';
    const catchChance = isDeep ? (0.55 - difficulty * 0.3) : (0.75 - difficulty * 0.2);
    const intChance = isDeep ? (0.08 + difficulty * 0.1) : (0.02 + difficulty * 0.05);
    const canIntercept = currentGame >= 2;
    const roll = Math.random();
    if (roll < catchChance) {
      animYards = isDeep ? Math.round(20 + Math.random() * 30) : Math.round(5 + Math.random() * 12);
      if (ballYard + animYards >= 100) { animYards = 100 - ballYard; animResult = 'touchdown'; }
      else animResult = 'complete';
    } else if (canIntercept && roll > (1 - intChance)) {
      animResult = 'interception'; animYards = 0;
    } else {
      animResult = 'incomplete'; animYards = 0;
    }
    animDuration = isDeep ? 2800 : 2200;
  }

  // Penalty chance (game 3+)
  if (currentGame >= 2 && Math.random() < 0.12) {
    const penType = Math.random() > 0.5 ? 'offsides' : 'holding';
    if (penType === 'offsides') { animResult = 'penalty_offsides'; animYards = 5; animDuration = 1500; }
    else if (Math.random() < 0.3) { animResult = 'penalty_holding'; animYards = 10; animDuration = 1500; }
  }

  playSound('whistle');
  gameTimeout(() => playSound('hit'), animDuration - 400);
}

function drawPlayAnimation(play) {
  const elapsed = Date.now() - animStartTime;
  const t = Math.min(1, elapsed / animDuration);

  for (const p of offensePlayers) {
    let dx = 0, dy = 0;
    if (p.role === 'RB' && play.type === 'run') {
      dy = t * 0.15;
      dx = play.id === 'run_left' ? -t * 0.1 : play.id === 'run_right' ? t * 0.1 : 0;
    } else if (p.role === 'WR') {
      dy = t * 0.2; dx = p.wx < 0 ? -t * 0.05 : t * 0.05;
    } else if (p.role === 'OL') {
      dy = t * 0.03;
    }
    drawPlayer(p.wx + dx, p.wy + dy, PATS.primary, PATS.secondary, false, p.label);
  }

  for (const p of defensePlayers) {
    drawPlayer(p.wx, p.wy - t * 0.04, SEA.primary, SEA.secondary, false, p.label);
  }

  if (play.type === 'pass' && t > 0.2 && t < 0.7) {
    const ballT = (t - 0.2) / 0.5;
    const targetWR = offensePlayers.find(p => p.role === 'WR');
    if (targetWR) drawBall(targetWR.wx, 0.2 + ballT * 0.25, true);
  } else if (play.type === 'run') {
    const rb = offensePlayers.find(p => p.role === 'RB');
    if (rb) {
      const dx = play.id === 'run_left' ? -t * 0.1 : play.id === 'run_right' ? t * 0.1 : 0;
      drawBall(rb.wx + dx, rb.wy + t * 0.15, false);
    }
  }

  if (t > 0.8 && t < 0.95) cameraShake = (1 - (t - 0.8) / 0.15) * 4;
}

    { wx: -0.4, wy: 0.26, role: 'WR', label: 'WR' },
    { wx: 0.4, wy: 0.26, role: 'WR', label: 'WR' },
  ];
  // Patriots defense (blue/red)
  const patsDef = [
    { wx: -0.12, wy: 0.29 }, { wx: -0.04, wy: 0.29 }, { wx: 0.04, wy: 0.29 }, { wx: 0.12, wy: 0.29 },
    { wx: -0.15, wy: 0.35, label: 'LB' }, { wx: 0, wy: 0.37, label: 'LB' }, { wx: 0.15, wy: 0.35, label: 'LB' },
    { wx: -0.4, wy: 0.42, label: 'CB' }, { wx: 0.4, wy: 0.42, label: 'CB' },
    { wx: -0.1, wy: 0.5, label: 'S' }, { wx: 0.1, wy: 0.5, label: 'S' },
  ];

  // Animate Seahawks slowly moving upfield
  for (const p of patsDef) {
    drawPlayer(p.wx, p.wy - t * 0.02, PATS.primary, PATS.secondary, false, p.label || '');
  }
  for (const p of seaOff) {
    const dy = t * 0.08;
    const dx = (p.role === 'WR' ? (p.wx < 0 ? -1 : 1) * t * 0.03 : 0);
    drawPlayer(p.wx + dx, p.wy + dy, SEA.primary, SEA.secondary, false, p.label || '');
  }
  // Ball with QB/RB
  drawBall(0, 0.2 + t * 0.08, false);

  // "DEFENSE" label on screen
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, H * 0.42, W, 36);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🛡️  SEAHAWKS POSSESSION  🛡️', W / 2, H * 0.42 + 24);
  ctx.restore();
}

// ---- COMMENTARY SYSTEM ----
function showCommentary(pbp, color, duration) {
  commentaryQueue.push({ pbp, color, duration: duration || 4000 });
  processCommentaryQueue();
}

function processCommentaryQueue() {
  if (currentCommentary || commentaryQueue.length === 0) return;
  currentCommentary = commentaryQueue.shift();

  pbpText.innerHTML = '<span class="espn-tag">ESPN</span>' + currentCommentary.pbp;
  if (currentCommentary.color) {
    colorText.textContent = currentCommentary.color;
    colorText.style.display = 'block';
  } else {
    colorText.style.display = 'none';
  }

  commentaryBar.classList.add('visible');
  playSound('bloop');

  commentaryTimer = setTimeout(() => {
    commentaryBar.classList.remove('visible');
    setTimeout(() => { currentCommentary = null; processCommentaryQueue(); }, 500);
  }, currentCommentary.duration);
}

function clearCommentary() {
  clearTimeout(commentaryTimer);
  commentaryBar.classList.remove('visible');
  currentCommentary = null;
  commentaryQueue = [];
}

// ---- MOMENT CARD SYSTEM (Queue-based, never blocks) ----
function queueMoment(key) {
  if (taughtMoments.has(key) || !MOMENTS[key]) return;
  taughtMoments.add(key);
  momentQueue.push(key);
}

function showNextMoment() {
  // If a moment is already showing or queue is empty, do nothing
  if (momentCard.classList.contains('visible') || momentQueue.length === 0) return;

  const key = momentQueue.shift();
  const m = MOMENTS[key];
  $('moment-emoji').textContent = m.emoji;
  $('moment-title').textContent = m.title;
  $('moment-body').innerHTML = m.body;

  // Save current state so we can return to it
  prevStateBeforeMoment = gameState;
  gameState = 'MOMENT';

  // Hide play cards while moment is showing
  playCardsEl.classList.remove('visible');

  dimOverlay.classList.add('visible');
  momentCard.classList.add('visible');
  playSound('bloop');
}

function dismissMoment() {
  momentCard.classList.remove('visible');
  dimOverlay.classList.remove('visible');

  // Restore previous state
  const restoreTo = prevStateBeforeMoment;
  prevStateBeforeMoment = null;

  // If there are more moments queued, show the next one after a brief delay
  if (momentQueue.length > 0) {
    gameTimeout(() => showNextMoment(), 400);
    return;
  }

  // No more moments — return to gameplay
  // If we were in the middle of resolving a play, do that now
  if (pendingResolve) {
    const fn = pendingResolve;
    pendingResolve = null;
    // Reset state before calling resolve — otherwise gameState stays 'MOMENT'
    // and any code checking state (like startNextPlay) will think a moment is still showing
    gameState = restoreTo || 'PLAY_RESULT';
    fn();
    return;
  }

  // Always go to PLAY_CALL — any other restored state would be unsafe
  gameState = 'PLAY_CALL';
  setupFormation('run');
  showPlayCards();
}

// Trigger moments and then show cards — called from startNextPlay
function showMomentsOrCards(momentKeys, afterMomentsFn) {
  // Queue up all the moment keys
  for (const key of momentKeys) queueMoment(key);

  // If there are moments to show, show them first
  if (momentQueue.length > 0) {
    setPendingResolve(afterMomentsFn);
    showNextMoment();
  } else {
    // No moments, go straight to the callback
    afterMomentsFn();
  }
}

// ---- SCOREBOARD UPDATE ----
function updateScoreboard() {
  $('pats-score').textContent = patsScore;
  $('sea-score').textContent = seaScore;
  const ordinals = ['', '1ST', '2ND', '3RD', '4TH'];
  $('down-distance').textContent = isPatsOffense
    ? `${ordinals[down] || '4TH'} & ${yardsToGo}`
    : 'DEF';
  // Yard line display: "OWN 25" or "SEA 45" etc
  const displayYard = ballYard <= 50 ? `OWN ${ballYard}` : `SEA ${100 - ballYard}`;
  $('yard-line').textContent = isPatsOffense ? `🏈 ${displayYard}` : '🛡️ DEFENSE';
  const mins = Math.floor(gameClock / 60);
  const secs = gameClock % 60;
  $('quarter-time').textContent = `Q${quarter} ${mins}:${secs.toString().padStart(2, '0')}`;
  $('pats-possession').classList.toggle('active', isPatsOffense);
  $('sea-possession').classList.toggle('active', !isPatsOffense);
  const gameNames = ['The Basics', 'Air It Out', 'The Full Picture', 'Clock Management', 'The Super Bowl'];
  $('game-label').textContent = `Game ${currentGame + 1} — ${gameNames[currentGame]}`;
  $('skip-game').style.display = currentGame < 4 ? 'block' : 'none';
}

// ---- PLAY CARDS ----
function showPlayCards() {
  const gameDef = GAME_DEFS[currentGame];
  let plays = [...gameDef.plays];

  if (down === 4) {
    // Always offer punt on 4th down
    plays.push({ id: 'punt', name: 'Punt', icon: '🦶', desc: 'Kick it away (safe)', type: 'punt' });
    // Offer FG in games 3+ when in range
    if (currentGame >= 2 && ballYard >= 55) {
      plays.push({ id: 'field_goal', name: 'Field Goal', icon: '🥅', desc: '3 points!', type: 'kick' });
    }
  }

  playCardsEl.innerHTML = '';
  for (const play of plays) {
    const card = document.createElement('div');
    card.className = 'play-card';
    card.innerHTML = `<span class="card-icon">${play.icon}</span><div class="card-name">${play.name}</div><div class="card-desc">${play.desc}</div>`;
    let cardTouched = false;
    card.addEventListener('touchend', (e) => { e.preventDefault(); cardTouched = true; selectPlay(play); });
    card.addEventListener('click', () => { if (!cardTouched) selectPlay(play); cardTouched = false; });
    playCardsEl.appendChild(card);
  }

  playCardsEl.classList.add('visible');
}

function hidePlayCards() {
  playCardsEl.classList.remove('visible');
}

// ---- GAME LOGIC ----
function selectPlay(play) {
  if (gameState !== 'PLAY_CALL') return;
  selectedPlay = play;
  hidePlayCards();

  if (play.type === 'kick') { executeFieldGoal(); return; }
  if (play.type === 'punt') { executePunt(); return; }

  setupFormation(play.type);
  gameState = 'SNAP_WAIT';
  snapPrompt.classList.add('visible');
}

function snapBall() {
  if (gameState !== 'SNAP_WAIT') return;
  snapPrompt.classList.remove('visible');
  playSound('snap');

  if (selectedPlay.type === 'pass') {
    gameState = 'PASS_TARGET';
    // Show commentary hint for pass
    if (!taughtMoments.has('receivers') && currentGame >= 1) {
      showCommentary("Tap a receiver to throw!", "See those highlighted players? Tap one!", 3000);
    }
  } else {
    gameState = 'PLAY_ACTIVE';
    startPlayAnimation(selectedPlay);
    gameTimeout(() => resolvePlay(), animDuration + 200);
  }
}

function throwToReceiver(target) {
  if (gameState !== 'PASS_TARGET') return;
  throwTarget = target;
  gameState = 'PLAY_ACTIVE';
  startPlayAnimation(selectedPlay);
  gameTimeout(() => resolvePlay(), animDuration + 200);
}

function executeFieldGoal() {
  gameState = 'PLAY_ACTIVE';
  const distance = 100 - ballYard + 17;
  const makeChance = Math.max(0.3, 1 - distance / 60);
  const made = Math.random() < makeChance;

  const attempt = pickRandom(COMMENTARY.FG_ATTEMPT);
  showCommentary(fillTemplate(attempt.pbp, { distance }), '', 2000);

  gameTimeout(() => {
    gameState = 'PLAY_RESULT';
    if (made) {
      const good = pickRandom(COMMENTARY.FG_GOOD);
      showCommentary(good.pbp, good.color, 3500);
    } else {
      const miss = pickRandom(COMMENTARY.FG_MISS);
      showCommentary(miss.pbp, miss.color, 3500);
    }
  }, 2000);

  queueMoment('field_goal');

  gameTimeout(() => {
    if (made) {
      patsScore += 3;
      playSound('crowd_roar');
      spawnConfetti(W / 2, H / 2);
    }
    updateScoreboard();
    advanceClock(25);

    if (momentQueue.length > 0) {
      setPendingResolve(() => endPossession());
      showNextMoment();
    } else {
      endPossession();
    }
  }, 3500);
}

function executePunt() {
  gameState = 'PLAY_ACTIVE';
  queueMoment('punt');

  const puntLine = pickRandom(COMMENTARY.PUNT);
  showCommentary(puntLine.pbp, puntLine.color, 3000);
  playSound('hit');

  advanceClock(20);

  gameTimeout(() => {
    if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;
    gameState = 'PLAY_RESULT';
    if (momentQueue.length > 0) {
      setPendingResolve(() => endPossession());
      showNextMoment();
    } else {
      endPossession();
    }
  }, 2500);
}

function setPendingResolve(fn) {
  if (pendingResolve) {
    const prev = pendingResolve;
    pendingResolve = () => { prev(); fn(); };
  } else {
    pendingResolve = fn;
  }
}

function resolvePlay() {
  // If a moment is showing, defer resolution
  if (gameState === 'MOMENT') {
    setPendingResolve(() => resolvePlay());
    return;
  }

  gameState = 'PLAY_RESULT';

  const play = selectedPlay;
  const yards = animYards;
  const result = animResult;

  // Commentary
  const lines = getPlayCommentary(play, result, yards);
  for (const line of lines) showCommentary(line.pbp, line.color, 3500);

  if (result === 'touchdown') {
    handleTouchdown();
    return;
  }

  if (result === 'interception') {
    handleInterception();
    return;
  }

  if (result === 'incomplete') {
    handleIncomplete();
    return;
  }

  if (result === 'penalty_offsides') {
    handlePenaltyOffsides();
    return;
  }

  if (result === 'penalty_holding') {
    handlePenaltyHolding();
    return;
  }

  // Normal play result — check TD BEFORE clamping
  if (ballYard + yards >= 100) {
    ballYard = 100;
    advanceClock(play.type === 'run' ? 35 : 20);
    handleTouchdown();
    return;
  }

  ballYard = clamp(ballYard + yards, 1, 99);
  yardsToGo -= yards;
  advanceClock(play.type === 'run' ? 35 : 20);

  if (yardsToGo <= 0) {
    down = 1;
    yardsToGo = 10;
    const fdLines = pickRandom(COMMENTARY.FIRST_DOWN);
    showCommentary(fdLines.pbp, fdLines.color, 2500);
    queueMoment('first_down');
  } else {
    down++;
  }

  spawnParticles(W / 2, H * 0.55, 10, 'rgba(255,255,255,0.5)', 2, 0.5);
  checkDowns();
}

function handleTouchdown() {
  queueMoment('touchdown');

  playSound('touchdown');
  playSound('crowd_roar');
  spawnConfetti(W / 2, H * 0.4);
  cameraShake = 6;

  gameTimeout(() => {
    if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;
    patsScore += 7;
    updateScoreboard();
    advanceClock(40);

    if (momentQueue.length > 0) {
      setPendingResolve(() => endPossession());
      showNextMoment();
    } else {
      endPossession();
    }
  }, 2500);
}

function handleInterception() {
  queueMoment('interception');
  spawnParticles(W / 2, H * 0.4, 20, SEA.secondary, 3, 1);
  playSound('crowd_groan');

  gameTimeout(() => {
    if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;
    advanceClock(30);
    if (momentQueue.length > 0) {
      setPendingResolve(() => endPossession());
      showNextMoment();
    } else {
      endPossession();
    }
  }, 2000);
}

function handleIncomplete() {
  queueMoment('incomplete');
  // Incomplete passes stop the clock (0 seconds)
  advanceClock(0);
  down++;

  if (momentQueue.length > 0) {
    setPendingResolve(() => checkDowns());
    showNextMoment();
  } else {
    checkDowns();
  }
}

function handlePenaltyOffsides() {
  queueMoment('penalty_offsides');
  const penLine = pickRandom(COMMENTARY.PENALTY_OFFSIDES);
  showCommentary(penLine.pbp, penLine.color, 3500);

  ballYard = clamp(ballYard + 5, 1, 99);
  yardsToGo -= 5;
  if (yardsToGo <= 0) { down = 1; yardsToGo = 10; }
  advanceClock(15);
  updateScoreboard();

  const goToPlayCall = () => { gameState = 'PLAY_CALL'; setupFormation('run'); showPlayCards(); };
  if (momentQueue.length > 0) {
    setPendingResolve(goToPlayCall);
    showNextMoment();
  } else {
    gameTimeout(() => goToPlayCall(), 2000);
  }
}

function handlePenaltyHolding() {
  queueMoment('penalty_holding');
  const penLine = pickRandom(COMMENTARY.PENALTY_HOLDING);
  showCommentary(penLine.pbp, penLine.color, 3500);

  ballYard = clamp(ballYard + 10, 1, 99);
  down = 1;
  yardsToGo = 10;
  advanceClock(15);
  updateScoreboard();

  const goToPlayCall = () => { gameState = 'PLAY_CALL'; setupFormation('run'); showPlayCards(); };
  if (momentQueue.length > 0) {
    setPendingResolve(goToPlayCall);
    showNextMoment();
  } else {
    gameTimeout(() => goToPlayCall(), 2000);
  }
}

function checkDowns() {
  updateScoreboard();

  if (down > 4) {
    const line = pickRandom(COMMENTARY.TURNOVER_ON_DOWNS);
    showCommentary(line.pbp, line.color, 3500);
    gameTimeout(() => endPossession(), 2000);
    return;
  }

  if (down === 4 && currentGame >= 2) {
    if (ballYard >= 55) {
      showCommentary("4th down — field goal range!", "You can try for 3 points with a kick, or go for it!", 3000);
    } else {
      showCommentary("4th down — decision time.", "It's risky to go for it. But you're gutsy, right?", 3000);
    }
  }

  // Continue drive
  gameTimeout(() => startNextPlay(), 1500);
}

function advanceClock(seconds) {
  gameClock = Math.max(0, gameClock - seconds);
  if (gameClock <= 120 && !taughtMoments.has('two_minute') && currentGame >= 3) {
    queueMoment('two_minute');
  }
  updateScoreboard();
}

function endPossession() {
  if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;
  driveCount++;
  playsThisDrive = 0;

  // Switch to Seahawks offense — show defensive phase
  isPatsOffense = false;
  gameState = 'SEA_OFFENSE';
  hidePlayCards();
  updateScoreboard();

  // Seahawks drive plays out visually over a few seconds
  const seaScoreChance = GAME_DEFS[currentGame].defDifficulty;
  const seaScores = Math.random() < seaScoreChance;
  const seaTD = seaScores && Math.random() > 0.3;

  // Start with commentary
  showCommentary("Seahawks take over on offense.", "Time for YOUR defense to step up!", 2500);

  // Simulate Seahawks driving — show a few quick updates
  seaBallYard = 25;
  advanceClock(30);

  gameTimeout(() => {
    if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;
    if (seaScores) {
      seaBallYard = 50 + Math.floor(Math.random() * 20);
      updateScoreboard();
      const midLine = seaTD
        ? { pbp: "Wilson finds a gap — Seahawks moving!", color: "They're driving downfield. The defense needs a stop!" }
        : { pbp: "Seattle pushing into field goal range...", color: "The defense is bending. Can they hold?" };
      showCommentary(midLine.pbp, midLine.color, 2500);
      advanceClock(40);
    } else {
      showCommentary("Defense holds! Seahawks go 3 and out!", "GREAT stop! That's what I like to see!", 2500);
      advanceClock(35);
    }
  }, 2500);

  gameTimeout(() => {
    if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;
    if (seaScores) {
      if (seaTD) {
        seaScore += 7;
        const line = pickRandom(COMMENTARY.SEA_TD);
        showCommentary(line.pbp, line.color, 3500);
        playSound('crowd_groan');
      } else {
        seaScore += 3;
        const line = pickRandom(COMMENTARY.SEA_FG);
        showCommentary(line.pbp, line.color, 3000);
        playSound('crowd_groan');
      }
    } else {
      const line = pickRandom(COMMENTARY.SEA_PUNT);
      showCommentary(line.pbp, line.color, 3000);
    }
    updateScoreboard();
    advanceClock(25);
  }, 5000);

  // After Seahawks drive, switch back to Patriots offense
  gameTimeout(() => {
    if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;

    if (driveCount >= totalDrivesPerHalf * 2) {
      gameState = 'ENDING';
      gameTimeout(() => endGame(), 2000);
      return;
    }

    // Quarter transitions
    if (driveCount === totalDrivesPerHalf) {
      quarter = 3; gameClock = 300;
      showCommentary("Second half begins!", "Let's keep this momentum going!", 3000);
    }
    if (driveCount === Math.floor(totalDrivesPerHalf * 0.5)) { quarter = 2; gameClock = 300; }
    if (driveCount === Math.floor(totalDrivesPerHalf * 1.5)) { quarter = 4; gameClock = 300; }

    isPatsOffense = true;
    ballYard = 20 + Math.floor(Math.random() * 10);
    down = 1;
    yardsToGo = 10;
    updateScoreboard();

    showCommentary("Patriots ball! Your turn to score.", "Let's put together a drive!", 2500);
    gameTimeout(() => startNextPlay(), 2000);
  }, 7500);
}

let seaBallYard = 25;

function startNextPlay() {
  // Don't start plays if game is ending or already over
  if (gameState === 'ENDING' || gameState === 'GAME_OVER') return;

  // If already in PLAY_CALL with cards visible, don't double-start
  if (gameState === 'PLAY_CALL' && playCardsEl.classList.contains('visible')) return;

  // If moment is showing, wait
  if (gameState === 'MOMENT') {
    setPendingResolve(() => startNextPlay());
    return;
  }

  playsThisDrive++;
  updateScoreboard();

  // Determine which moments to teach before this play
  const concepts = GAME_DEFS[currentGame].concepts;
  const momentsToTeach = [];

  if (playsThisDrive === 1 && driveCount === 0) {
    if (concepts.includes('field')) momentsToTeach.push('field');
    if (concepts.includes('offense')) momentsToTeach.push('offense');
    if (concepts.includes('passing')) momentsToTeach.push('passing');
    if (concepts.includes('downs')) momentsToTeach.push('downs');
    if (concepts.includes('clock')) momentsToTeach.push('clock');
  }
  if (playsThisDrive === 2 && concepts.includes('running')) momentsToTeach.push('running');

  // Show moments first, then transition to PLAY_CALL
  showMomentsOrCards(momentsToTeach, () => {
    gameState = 'PLAY_CALL';
    setupFormation('run');
    showPlayCards();
  });
}

function endGame() {
  gameState = 'GAME_OVER';
  clearGameTimeouts();
  hidePlayCards();
  clearCommentary();
  scoreboardEl.classList.remove('visible');

  const won = patsScore > seaScore;

  $('result-emoji').textContent = won ? '🏆' : '😤';
  $('result-title').textContent = won ? 'VICTORY!' : 'DEFEAT';
  $('result-score').textContent = `${patsScore} - ${seaScore}`;

  if (won) {
    $('result-msg').textContent = currentGame < 4
      ? 'Great job! You beat the Seahawks! Ready for the next challenge?'
      : "YOU WON THE SUPER BOWL! You've mastered football!";
    $('btn-next').textContent = currentGame < 4 ? 'Next Game' : 'Play Again';
    $('btn-next').style.display = 'block';
    spawnConfetti(W / 2, H / 2);
    playSound('touchdown');
  } else {
    $('result-msg').textContent = "The Seahawks got you this time. Want to try again?";
    $('btn-next').style.display = 'none';
  }

  gameOverEl.style.display = 'flex';
  playSound('crowd_roar');
  saveState();
}

$('btn-next').addEventListener('click', () => {
  if (currentGame < 4) currentGame++;
  else { currentGame = 0; taughtMoments.clear(); }
  startNewGame();
});

$('btn-replay').addEventListener('click', () => { taughtMoments.clear(); startNewGame(); });

// Skip to next game
$('skip-game').addEventListener('click', (e) => {
  e.stopPropagation();
  if (currentGame < 4 && gameState !== 'ENDING' && gameState !== 'GAME_OVER') {
    currentGame++;
    startNewGame();
  }
});
$('skip-game').addEventListener('touchend', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (currentGame < 4 && gameState !== 'ENDING' && gameState !== 'GAME_OVER') {
    currentGame++;
    startNewGame();
  }
});

function startNewGame() {
  gameOverEl.style.display = 'none';
  clearGameTimeouts();
  // Hide any stale moment card or dim overlay from previous game
  momentCard.classList.remove('visible');
  dimOverlay.classList.remove('visible');
  hidePlayCards();
  snapPrompt.classList.remove('visible');
  patsScore = 0; seaScore = 0;
  down = 1; yardsToGo = 10;
  ballYard = 25; quarter = 1; gameClock = 300;
  driveCount = 0; playsThisDrive = 0;
  isPatsOffense = true; particles = [];
  momentQueue = []; pendingResolve = null;
  prevStateBeforeMoment = null;
  momentDismissing = false;
  stuckTimer = 0;
  clearCommentary();
  showMatchupCard();
  saveState();
}

// ---- TUNNEL SEQUENCE ----
const tunnelTexts = [
  "SUPER BOWL SUNDAY",
  "From Gillette Stadium...",
  "The New England Patriots take the field!",
  "And on the other side... the Seattle Seahawks.",
  "If you're new to football — don't worry.",
  "We'll teach you everything.",
  "LET'S PLAY SOME FOOTBALL!"
];

function startTunnel() {
  gameState = 'TUNNEL';
  tunnelOverlay.style.display = 'block';
  tunnelPhase = 0;
  tunnelStartTime = Date.now();
  tunnelLight = 0;
  tunnelAborted = false;
  tunnelTimeouts = [];
  showTunnelText(0);
  startCrowdAmbient();
}

function showTunnelText(index) {
  if (tunnelAborted) return;
  if (index >= tunnelTexts.length) { endTunnel(); return; }
  tunnelPhase = index;
  const textEl = $('tunnel-text');
  textEl.classList.remove('visible');
  const t1 = setTimeout(() => {
    if (tunnelAborted) return;
    textEl.textContent = tunnelTexts[index];
    textEl.classList.add('visible');
    const delay = index === 0 ? 2000 : index === tunnelTexts.length - 1 ? 1500 : 2200;
    const t2 = setTimeout(() => {
      if (tunnelAborted) return;
      textEl.classList.remove('visible');
      const t3 = setTimeout(() => { if (!tunnelAborted) showTunnelText(index + 1); }, 400);
      tunnelTimeouts.push(t3);
    }, delay);
    tunnelTimeouts.push(t2);
  }, 100);
  tunnelTimeouts.push(t1);
}

function drawTunnel() {
  const elapsed = (Date.now() - tunnelStartTime) / 1000;
  tunnelLight = Math.min(1, elapsed / (tunnelTexts.length * 2.5));

  tunnelCtx.fillStyle = '#000';
  tunnelCtx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const tunnelWidth = W * 0.85, tunnelHeight = H * 0.7;
  const outerRad = Math.max(tunnelWidth, tunnelHeight) * 0.5;
  const innerRad = outerRad * (0.1 + tunnelLight * 0.9);

  const grad = tunnelCtx.createRadialGradient(cx, cy * 0.8, innerRad * 0.1, cx, cy * 0.8, innerRad);
  grad.addColorStop(0, `rgba(200,220,255,${tunnelLight * 0.8})`);
  grad.addColorStop(0.3, `rgba(100,150,200,${tunnelLight * 0.3})`);
  grad.addColorStop(0.7, `rgba(20,40,60,${tunnelLight * 0.1})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  tunnelCtx.fillStyle = grad;
  tunnelCtx.fillRect(0, 0, W, H);

  for (let i = 0; i < 6; i++) {
    const d = (i + 1) / 7;
    const ringW = tunnelWidth * d * 0.5, ringH = tunnelHeight * d * 0.5;
    const alpha = (1 - d) * 0.3 * (1 - tunnelLight);
    tunnelCtx.strokeStyle = `rgba(80,80,100,${alpha})`;
    tunnelCtx.lineWidth = 3;
    tunnelCtx.beginPath();
    tunnelCtx.ellipse(cx, cy * 0.85, ringW, ringH, 0, 0, TAU);
    tunnelCtx.stroke();
  }

  if (tunnelLight > 0.5) {
    const fieldAlpha = (tunnelLight - 0.5) * 2;
    const fGrad = tunnelCtx.createRadialGradient(cx, cy, 0, cx, cy, outerRad * 0.6);
    fGrad.addColorStop(0, `rgba(46,125,50,${fieldAlpha * 0.4})`);
    fGrad.addColorStop(1, 'rgba(0,0,0,0)');
    tunnelCtx.fillStyle = fGrad;
    tunnelCtx.fillRect(0, 0, W, H);
  }

  if (tunnelLight > 0.8) {
    tunnelCtx.fillStyle = `rgba(255,255,255,${Math.min(1, (tunnelLight - 0.8) * 5)})`;
    tunnelCtx.fillRect(0, 0, W, H);
  }
}

function endTunnel() {
  if (tunnelAborted) return;
  tunnelAborted = true;
  const flash = document.createElement('div');
  flash.className = 'screen-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);
  tunnelOverlay.style.display = 'none';
  showMatchupCard();
}

function skipTunnel() {
  if (tunnelAborted) return;
  tunnelAborted = true;
  // Cancel all pending tunnel timeouts
  for (const t of tunnelTimeouts) clearTimeout(t);
  tunnelTimeouts = [];
  tunnelOverlay.style.display = 'none';
  showMatchupCard();
}

// ---- MATCHUP CARD ----
function showMatchupCard() {
  $('mc-game-label').textContent = `Game ${currentGame + 1} of 5`;
  matchupCard.style.display = 'flex';
  gameState = 'MATCHUP';
  setCrowdVolume(0.5);
}

function dismissMatchupCard() {
  matchupCard.style.display = 'none';
  startGameplay();
}

function startGameplay() {
  gameState = 'INTRO'; // transitional state — no interaction until cards appear
  scoreboardEl.classList.add('visible');
  updateScoreboard();

  const intros = [
    [
      { pbp: "Welcome to your first game, Jade!", color: "You're the Patriots. Your job? Get the ball to the end zone. Let's learn as we go!" },
      { pbp: "Pick a play card below to get started.", color: "Don't overthink it — just pick one and let's see what happens!" }
    ],
    [
      { pbp: "Game 2 — time to throw the ball!", color: "You've got new plays now. After the snap, tap a receiver to throw to them!" },
    ],
    [
      { pbp: "Game 3 — things get real.", color: "Watch out for penalties and turnovers. And if you're close, try a field goal!" },
    ],
    [
      { pbp: "The clock matters now.", color: "Running eats clock. Incomplete passes stop it. Think before you pick!" },
    ],
    [
      { pbp: "THIS IS IT. The Super Bowl!", color: "Everything you've learned comes together. Win this and you've MASTERED football!" },
    ]
  ];

  const intro = intros[currentGame] || intros[0];
  for (const line of intro) showCommentary(line.pbp, line.color, 4500);

  setupFormation('run');
  gameTimeout(() => startNextPlay(), 2000);
}

// ---- SAVE / RESTORE STATE ----
function saveState() {
  try {
    const state = {
      currentGame, patsScore, seaScore, down, yardsToGo, ballYard,
      quarter, gameClock, driveCount, playsThisDrive, isPatsOffense,
      taughtMoments: [...taughtMoments],
      gameState: gameState === 'GAME_OVER' ? 'GAME_OVER' : 'PLAY_CALL'
    };
    localStorage.setItem('jades-game-save', JSON.stringify(state));
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem('jades-game-save');
    if (!raw) return false;
    const state = JSON.parse(raw);
    if (!state || state.currentGame === undefined) return false;

    currentGame = state.currentGame;
    patsScore = state.patsScore || 0;
    seaScore = state.seaScore || 0;
    down = state.down || 1;
    yardsToGo = state.yardsToGo || 10;
    ballYard = state.ballYard || 25;
    quarter = state.quarter || 1;
    gameClock = state.gameClock || 300;
    driveCount = state.driveCount || 0;
    playsThisDrive = state.playsThisDrive || 0;
    isPatsOffense = state.isPatsOffense !== false;
    taughtMoments = new Set(state.taughtMoments || []);

    return true;
  } catch(e) { return false; }
}

function clearSave() {
  try { localStorage.removeItem('jades-game-save'); } catch(e) {}
}

// ---- TOUCH INPUT ----
let lastTouchTime = 0;

// DIRECT listeners on overlay screens — bulletproof, can NEVER get stuck
let momentDismissing = false;
function momentTapHandler(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!audioUnlocked) initAudio();
  if (momentDismissing) return; // prevent double-fire from touchstart+click
  // Primary check: state is MOMENT
  if (gameState === 'MOMENT') {
    momentDismissing = true;
    dismissMoment();
    setTimeout(() => { momentDismissing = false; }, 300);
    return;
  }
  // Safety net: if card is visible but state got corrupted, force dismiss
  if (momentCard.classList.contains('visible')) {
    momentDismissing = true;
    momentCard.classList.remove('visible');
    dimOverlay.classList.remove('visible');
    momentQueue = []; // clear any remaining queued moments
    if (pendingResolve) {
      const fn = pendingResolve;
      pendingResolve = null;
      gameState = 'PLAY_RESULT'; // reset from corrupted state before calling resolve
      fn();
    } else {
      gameState = 'PLAY_CALL';
      setupFormation('run');
      showPlayCards();
    }
    setTimeout(() => { momentDismissing = false; }, 300);
  }
}
momentCard.addEventListener('touchstart', momentTapHandler, { passive: false });
momentCard.addEventListener('click', momentTapHandler);
dimOverlay.addEventListener('touchstart', momentTapHandler, { passive: false });
dimOverlay.addEventListener('click', momentTapHandler);

// Matchup card direct listener
function matchupTapHandler(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!audioUnlocked) initAudio();
  if (gameState === 'MATCHUP') dismissMatchupCard();
}
matchupCard.addEventListener('touchstart', matchupTapHandler, { passive: false });
matchupCard.addEventListener('click', matchupTapHandler);

// Title screen direct listener
function titleTapHandler(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!audioUnlocked) initAudio();
  if (gameState === 'TITLE') {
    clearSave(); // fresh start
    titleScreen.style.display = 'none';
    startTunnel();
  }
}
titleScreen.addEventListener('touchstart', titleTapHandler, { passive: false });
titleScreen.addEventListener('click', titleTapHandler);

// Tunnel direct listener
function tunnelTapHandler(e) {
  e.preventDefault();
  e.stopPropagation();
  if (gameState === 'TUNNEL') skipTunnel();
}
tunnelOverlay.addEventListener('touchstart', tunnelTapHandler, { passive: false });
tunnelOverlay.addEventListener('click', tunnelTapHandler);

document.addEventListener('touchstart', (e) => {
  lastTouchTime = Date.now();
  handleTouch(e);
}, { passive: false });

document.addEventListener('click', (e) => {
  if (Date.now() - lastTouchTime < 500) return;
  handleTouch(e);
});

function handleTouch(e) {
  if (!audioUnlocked) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX, y = touch.clientY;

  if (gameState === 'TITLE') {
    e.preventDefault();
    titleScreen.style.display = 'none';
    startTunnel();
    return;
  }

  if (gameState === 'TUNNEL') {
    e.preventDefault();
    skipTunnel();
    return;
  }

  if (gameState === 'MATCHUP') {
    e.preventDefault();
    dismissMatchupCard();
    return;
  }

  if (gameState === 'MOMENT') {
    e.preventDefault();
    if (!momentDismissing) {
      momentDismissing = true;
      dismissMoment();
      setTimeout(() => { momentDismissing = false; }, 300);
    }
    return;
  }

  if (gameState === 'SNAP_WAIT') {
    e.preventDefault();
    snapBall();
    return;
  }

  if (gameState === 'PASS_TARGET') {
    // Check if they tapped a receiver
    for (const rt of receiverTargets) {
      const dx = x - rt.screenX, dy = y - rt.screenY;
      if (Math.sqrt(dx*dx + dy*dy) < 50) {
        e.preventDefault();
        throwToReceiver(rt);
        return;
      }
    }
    // ESCAPE: If user taps empty space, throw to nearest receiver (don't get stuck)
    if (receiverTargets.length > 0) {
      e.preventDefault();
      let nearest = receiverTargets[0], bestDist = Infinity;
      for (const rt of receiverTargets) {
        const dx = x - rt.screenX, dy = y - rt.screenY;
        const dist = dx*dx + dy*dy;
        if (dist < bestDist) { bestDist = dist; nearest = rt; }
      }
      throwToReceiver(nearest);
    }
    return;
  }

  if (gameState === 'GAME_OVER') {
    // taps on game over handled by button listeners
    return;
  }
}

// ---- MAIN RENDER LOOP ----
function render(time) {
  const dt = Math.min(0.05, (time - (lastFrameTime || time)) / 1000);
  lastFrameTime = time;

  ctx.clearRect(0, 0, W, H);

  // Camera shake — always matched save/restore
  cameraShakeActive = cameraShake > 0.1;
  if (cameraShakeActive) {
    ctx.save();
    ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
    cameraShake *= 0.9;
    if (cameraShake < 0.1) cameraShake = 0;
  }

  if (gameState !== 'TITLE' && gameState !== 'TUNNEL' && gameState !== 'MATCHUP') {
    drawField();

    if (gameState === 'SEA_OFFENSE') {
      drawSeaOffense();
    } else if (gameState === 'PLAY_CALL' || gameState === 'SNAP_WAIT' || gameState === 'MOMENT' || gameState === 'INTRO' || gameState === 'ENDING') {
      drawFormation(false);
      drawBall(0, 0.22, false);
    } else if (gameState === 'PASS_TARGET') {
      drawFormation(true);
      drawBall(0, 0.22, false);
    } else if (gameState === 'PLAY_ACTIVE') {
      drawPlayAnimation(selectedPlay);
    } else if (gameState === 'PLAY_RESULT' || gameState === 'SCORE_ANIM') {
      drawFormation(false);
    } else {
      drawFormation(false);
    }

    drawParticles();
  }

  if (gameState === 'TUNNEL') drawTunnel();

  // Always restore if we saved
  if (cameraShakeActive) ctx.restore();

  updateParticles(dt);

  // Auto-save periodically
  if (Math.random() < 0.002 && gameState === 'PLAY_CALL') saveState();

  // WATCHDOG: If game is stuck, force recovery
  stuckTimer += dt;
  if (gameState === 'PLAY_CALL' && !playCardsEl.classList.contains('visible')) {
    // Play call state but no cards showing — force show after 3s
    if (stuckTimer > 3) { setupFormation('run'); showPlayCards(); stuckTimer = 0; }
  } else if (gameState === 'PLAY_RESULT' || gameState === 'INTRO') {
    // These are transient states — if stuck for 8s, force to PLAY_CALL
    if (stuckTimer > 8) { gameState = 'PLAY_CALL'; setupFormation('run'); showPlayCards(); stuckTimer = 0; }
  } else {
    stuckTimer = 0;
  }

  requestAnimationFrame(render);
}

// ---- BOOT ----
function boot() {
  const hasSave = loadState();

  if (hasSave) {
    // Resume from save — skip title/tunnel, go straight to matchup for this game
    titleScreen.style.display = 'none';
    showMatchupCard();
  }
  // Otherwise start at title screen (default gameState = 'TITLE')

  requestAnimationFrame(render);
}

boot();

})();
</script>
